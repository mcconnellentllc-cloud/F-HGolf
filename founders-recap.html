<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Founders — Tournament Recap</title>
  <meta name="description" content="Recap of the 2026 Founder's Tournament at F&H Golf Course — champions, flight winners, Calcutta highlights, and stories from the weekend." />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <meta name="theme-color" content="#0b1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a10;
      --bg-2: #12261a;
      --panel: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.14);
      --gold: #f5c542;
      --ink: #f6f9f4;
      --muted: rgba(246,249,244,0.62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
    body { background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 60%); }

    .disp { min-height: 100vh; display: flex; flex-direction: column; }
    .disp__hero { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(0.75rem, 2vw, 1.5rem); padding: clamp(1rem, 2vw, 1.5rem) clamp(1rem, 2vw, 1.75rem); background: #000; border-bottom: 3px solid #000; }
    .disp__logo { width: clamp(3.4rem, 6vw, 5.4rem); height: clamp(3.4rem, 6vw, 5.4rem); border-radius: 50%; background: #fff; padding: clamp(0.25rem, 0.5vw, 0.45rem); box-shadow: 0 0 0 3px #000, 0 0 0 5px rgba(255,255,255,0.15); object-fit: contain; }
    .disp__logo--r { justify-self: end; }
    .disp__hero__title { text-align: center; }
    .disp__eyebrow { text-transform: uppercase; letter-spacing: 0.4em; color: #fff; font-weight: 800; font-size: clamp(0.7rem, 1.15vw, 0.95rem); }
    .disp__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2.1rem, 5vw, 4.2rem); margin: 0.1em 0 0; line-height: 1; letter-spacing: 0.01em; color: #fff; }
    .disp__sub { color: rgba(255,255,255,0.75); font-size: clamp(0.95rem, 1.5vw, 1.2rem); margin: 0.15em 0 0; font-style: italic; }
    @media (max-width: 720px) {
      .disp__hero { grid-template-columns: 1fr; text-align: center; padding-top: 1rem; }
      .disp__logo { margin: 0 auto; }
      .disp__logo--r { display: none; }
    }

    /* Slim nav strip -- matches the leaderboard + calcutta displays. */
    .disp__nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 0.75rem 1rem; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--line); }
    .disp__nav a { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.95rem; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--ink); font-weight: 700; text-decoration: none; font-size: clamp(0.85rem, 1.1vw, 1rem); letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease, color 0.15s ease; }
    .disp__nav a:hover, .disp__nav a:focus-visible { background: var(--gold); color: #0b1a10; border-color: var(--gold); outline: none; }
    .disp__nav a.is-here { background: rgba(245,197,66,0.15); color: var(--gold); border-color: rgba(245,197,66,0.35); pointer-events: none; }
    .disp__nav-emoji { font-size: 1.1em; line-height: 1; }

    /* Article-style body -- generous line-height, wide serif headings, gold
       accents on names/dollars set with **bold** in the source text. */
    .recap { flex: 1; max-width: 60rem; width: 100%; margin: 0 auto; padding: clamp(1.4rem, 3vw, 3rem) clamp(1rem, 2vw, 2rem) 4rem; font-size: clamp(1rem, 1.25vw, 1.15rem); line-height: 1.65; }
    .recap h1 { font-family: "Fraunces", Georgia, serif; font-weight: 800; color: var(--gold); font-size: clamp(1.9rem, 3.5vw, 2.8rem); line-height: 1.15; margin: 0 0 0.6em; }
    .recap h2 { font-family: "Fraunces", Georgia, serif; font-weight: 700; color: #fff; font-size: clamp(1.35rem, 2.4vw, 1.9rem); line-height: 1.2; margin: 1.6em 0 0.5em; padding-bottom: 0.25em; border-bottom: 1px solid var(--line); }
    .recap h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; color: var(--ink); font-size: clamp(1.15rem, 1.8vw, 1.35rem); margin: 1.2em 0 0.4em; }
    .recap p { margin: 0 0 1em; color: var(--ink); }
    .recap ul { margin: 0 0 1.2em; padding: 0; list-style: none; }
    .recap ul li { position: relative; padding: 0.25em 0 0.25em 1.4em; border-bottom: 1px dashed var(--line); }
    .recap ul li:last-child { border-bottom: none; }
    .recap ul li::before { content: "•"; position: absolute; left: 0.35em; color: var(--gold); font-weight: 800; }
    .recap b, .recap strong { color: var(--gold); font-weight: 800; }
    .recap a { color: var(--gold); }

    .recap__empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-style: italic; }
    .recap__foot { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0.6rem 1rem 1.5rem; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main class="disp" role="main">
    <header class="disp__hero">
      <img class="disp__logo" src="images/logo.png" alt="F&H Golf Course" />
      <div class="disp__hero__title">
        <div class="disp__eyebrow">Tournament Recap</div>
        <h1 class="disp__title">2026 Founders</h1>
        <p class="disp__sub">F&amp;H Golf Course · Aug 8&ndash;9</p>
      </div>
      <img class="disp__logo disp__logo--r" src="images/logo.png" alt="" aria-hidden="true" />
    </header>

    <nav class="disp__nav" aria-label="Founders public pages">
      <a href="index.html"><span class="disp__nav-emoji" aria-hidden="true">🏠</span> F&amp;H Home</a>
      <a href="tournaments.html"><span class="disp__nav-emoji" aria-hidden="true">📅</span> Tournaments</a>
      <a href="founders-calcutta-display.html"><span class="disp__nav-emoji" aria-hidden="true">💰</span> Calcutta</a>
      <a class="is-here" href="founders-recap.html" aria-current="page"><span class="disp__nav-emoji" aria-hidden="true">📝</span> Recap</a>
      <a href="founders-leaderboard-display.html"><span class="disp__nav-emoji" aria-hidden="true">🏆</span> Leaderboard</a>
    </nav>

    <article class="recap" id="recapBody">
      <p class="recap__empty">Loading the recap&hellip;</p>
    </article>

    <footer class="recap__foot"><span id="recapUpdated">&nbsp;</span></footer>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var KEY = "Founder's Tournament (Aug 8–9)";
      var host = document.getElementById("recapBody");

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      // Lightweight markdown-ish renderer -- handles the shape the admin
      // Recap tab produces: # / ## / ### headings, `- ` bullets, blank line
      // for paragraphs, `**text**` for bold. Kept purposely small so
      // there's no external dependency and the page renders instantly.
      function inline(s) {
        // Escape first, then apply **bold** on the escaped output.
        var e = esc(s);
        e = e.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
        return e;
      }
      function renderMarkdown(text) {
        var out = [];
        var lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
        var i = 0, buf = [];
        function flushParagraph() { if (buf.length) { out.push("<p>" + inline(buf.join(" ")) + "</p>"); buf = []; } }
        while (i < lines.length) {
          var raw = lines[i];
          var trimmed = raw.trim();
          if (!trimmed) { flushParagraph(); i++; continue; }
          var h = /^(#{1,3})\s+(.+)$/.exec(trimmed);
          if (h) {
            flushParagraph();
            var level = h[1].length;
            out.push("<h" + level + ">" + inline(h[2]) + "</h" + level + ">");
            i++; continue;
          }
          if (/^-\s+/.test(trimmed)) {
            flushParagraph();
            var items = [];
            while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
              items.push(inline(lines[i].replace(/^\s*-\s+/, "")));
              i++;
            }
            out.push("<ul>" + items.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>");
            continue;
          }
          buf.push(trimmed);
          i++;
        }
        flushParagraph();
        return out.join("\n");
      }

      function empty() {
        host.innerHTML =
          '<div class="recap__empty">'
          + '<h1 style="color:var(--gold);margin-bottom:0.5em;">Recap coming soon.</h1>'
          + '<p>The 2026 Founder\'s Tournament recap is being written up. Check back shortly, or head to the <a href="founders-leaderboard-display.html">live leaderboard</a> for final placings.</p>'
          + '</div>';
      }

      fetch(FH_API.url("/api/tournament-signups"), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) { empty(); return; }
          var text = (j.recaps && j.recaps[KEY]) || "";
          if (!text.trim()) { empty(); return; }
          host.innerHTML = renderMarkdown(text);
        })
        .catch(function () { empty(); });
    })();
  </script>
</body>
</html>
