<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Rules — F&H Golf Course</title>
  <meta name="description" content="Rules for a tournament at F&H Golf Course. Auto-generated from the tournament's format so the printed rules always match the field." />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <meta name="theme-color" content="#0b1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a10;
      --bg-2: #12261a;
      --panel: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.14);
      --gold: #f5c542;
      --ink: #f6f9f4;
      --muted: rgba(246,249,244,0.62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
    body { background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 60%); }

    .disp { min-height: 100vh; display: flex; flex-direction: column; }
    .disp__hero { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(0.75rem, 2vw, 1.5rem); padding: clamp(1rem, 2vw, 1.5rem) clamp(1rem, 2vw, 1.75rem); background: #000; border-bottom: 3px solid #000; }
    .disp__logo { width: clamp(3.4rem, 6vw, 5.4rem); height: clamp(3.4rem, 6vw, 5.4rem); border-radius: 50%; background: #fff; padding: clamp(0.25rem, 0.5vw, 0.45rem); box-shadow: 0 0 0 3px #000, 0 0 0 5px rgba(255,255,255,0.15); object-fit: contain; }
    .disp__logo--r { justify-self: end; }
    .disp__hero__title { text-align: center; }
    .disp__eyebrow { text-transform: uppercase; letter-spacing: 0.4em; color: #fff; font-weight: 800; font-size: clamp(0.7rem, 1.15vw, 0.95rem); }
    .disp__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2.1rem, 5vw, 4.2rem); margin: 0.1em 0 0; line-height: 1; letter-spacing: 0.01em; color: #fff; }
    .disp__sub { color: rgba(255,255,255,0.75); font-size: clamp(0.95rem, 1.5vw, 1.2rem); margin: 0.15em 0 0; font-style: italic; }
    @media (max-width: 720px) {
      .disp__hero { grid-template-columns: 1fr; text-align: center; padding-top: 1rem; }
      .disp__logo { margin: 0 auto; }
      .disp__logo--r { display: none; }
    }

    .disp__nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 0.75rem 1rem; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--line); }
    .disp__nav a { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.95rem; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--ink); font-weight: 700; text-decoration: none; font-size: clamp(0.85rem, 1.1vw, 1rem); letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease, color 0.15s ease; }
    .disp__nav a:hover, .disp__nav a:focus-visible { background: var(--gold); color: #0b1a10; border-color: var(--gold); outline: none; }
    .disp__nav a.is-here { background: rgba(245,197,66,0.15); color: var(--gold); border-color: rgba(245,197,66,0.35); pointer-events: none; }

    .rules { flex: 1; max-width: 60rem; width: 100%; margin: 0 auto; padding: clamp(1.4rem, 3vw, 3rem) clamp(1rem, 2vw, 2rem) 4rem; font-size: clamp(1rem, 1.25vw, 1.15rem); line-height: 1.6; }
    .rules h4 { font-family: "Fraunces", Georgia, serif; font-weight: 700; color: var(--gold); font-size: clamp(1.15rem, 2vw, 1.5rem); margin: 1.5em 0 0.5em; padding-bottom: 0.25em; border-bottom: 1px solid var(--line); }
    .rules h4:first-of-type { margin-top: 0.2em; }
    .rules ul { margin: 0 0 1.2em; padding: 0; list-style: none; }
    .rules li { position: relative; padding: 0.35em 0 0.35em 1.5em; border-bottom: 1px dashed var(--line); color: var(--ink); }
    .rules li:last-child { border-bottom: none; }
    .rules li::before { content: "•"; position: absolute; left: 0.4em; color: var(--gold); font-weight: 800; }
    .rules b, .rules strong { color: var(--gold); font-weight: 800; }

    .rules__empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-style: italic; }
    .rules__foot { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0.6rem 1rem 1.5rem; letter-spacing: 0.06em; }

    .missing { max-width: 40rem; margin: 4rem auto; padding: 2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: center; }
    .missing h1 { font-family: "Fraunces", Georgia, serif; color: var(--gold); margin: 0 0 0.5rem; }
    .missing a { color: var(--gold); font-weight: 700; }
  </style>
</head>
<body>
  <main class="disp" role="main">
    <header class="disp__hero">
      <img class="disp__logo" src="images/logo.png" alt="F&H Golf Course" />
      <div class="disp__hero__title">
        <div class="disp__eyebrow">Tournament Rules</div>
        <h1 class="disp__title" id="rulesTitle">Tournament</h1>
        <p class="disp__sub" id="rulesSub">F&amp;H Golf Course</p>
      </div>
      <img class="disp__logo disp__logo--r" src="images/logo.png" alt="" aria-hidden="true" />
    </header>

    <nav class="disp__nav" aria-label="Tournament public pages" id="rulesNav">
      <a href="index.html">F&amp;H Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a id="navLeaderboard" href="leaderboard.html">Live leaderboard</a>
      <a class="is-here" aria-current="page">Rules</a>
      <a id="navRecap" href="recap.html">Recap</a>
    </nav>

    <article class="rules" id="rulesBody">
      <p class="rules__empty">Loading rules&hellip;</p>
    </article>

    <footer class="rules__foot"><span id="rulesUpdated">Auto-generated from the tournament's Format &mdash; edit the Format tab to change what appears here.</span></footer>
  </main>

  <script src="js/api.js"></script>
  <script src="js/tournament-rules.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var KEY = params.get("t") || "";
      var host = document.getElementById("rulesBody");
      var titleEl = document.getElementById("rulesTitle");
      var subEl = document.getElementById("rulesSub");
      var navLeader = document.getElementById("navLeaderboard");
      var navRecap = document.getElementById("navRecap");

      if (!KEY) {
        document.querySelector(".disp").innerHTML =
          '<div class="missing"><h1>Pick a tournament</h1>'
          + '<p>This page needs a tournament to know which rules to show. Head to <a href="tournaments.html">Tournaments</a> and open one.</p></div>';
        return;
      }

      navLeader.href = "leaderboard.html?t=" + encodeURIComponent(KEY);
      navRecap.href = "recap.html?t=" + encodeURIComponent(KEY);
      document.title = KEY + " — Rules | F&H Golf Course";

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      // Match the same title-splitting the Recap page uses: pull the date
      // out of the trailing parens for the subtitle so the H1 reads clean.
      function applyTitle(display) {
        var name = display || KEY;
        var m = /^(.*)\s+\(([^)]+)\)\s*$/.exec(name);
        if (m) {
          titleEl.textContent = m[1];
          subEl.innerHTML = "F&amp;H Golf Course &middot; " + esc(m[2]);
        } else {
          titleEl.textContent = name;
          subEl.textContent = "F&H Golf Course";
        }
      }

      fetch(FH_API.url("/api/tournament-signups") + "?config=" + encodeURIComponent(KEY), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var fields = (j && j.ok && j.record && j.record.fields) || null;
          var display = (fields && (fields["Display Name"] || fields["Name"])) || "";
          applyTitle(display);
          if (!window.FH_RULES || !window.FH_RULES.buildTournamentRules) {
            host.innerHTML = '<p class="rules__empty">Rules generator failed to load. Please refresh the page.</p>';
            return;
          }
          host.innerHTML = window.FH_RULES.buildTournamentRules(fields || {}, KEY);
        })
        .catch(function () {
          applyTitle("");
          if (window.FH_RULES && window.FH_RULES.buildTournamentRules) {
            host.innerHTML = window.FH_RULES.buildTournamentRules({}, KEY);
          } else {
            host.innerHTML = '<p class="rules__empty">Couldn\'t load these rules right now. Please try again in a moment.</p>';
          }
        });
    })();
  </script>
</body>
</html>
