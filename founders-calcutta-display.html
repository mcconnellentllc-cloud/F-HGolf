<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Founders — Calcutta Auction</title>
  <meta name="description" content="Live Calcutta auction board for the F&H Golf Founders Tournament." />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <meta name="theme-color" content="#0b1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a10;
      --bg-2: #12261a;
      --panel: rgba(255,255,255,0.06);
      --panel-2: rgba(255,255,255,0.10);
      --line: rgba(255,255,255,0.14);
      --gold: #f5c542;
      --green: #3fbc6b;
      --red: #e64339;
      --ink: #f6f9f4;
      --muted: rgba(246,249,244,0.62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
    body { background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 60%); }

    .disp { min-height: 100vh; display: flex; flex-direction: column; }
    .disp__hero { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(0.75rem, 2vw, 1.5rem); padding: clamp(0.8rem, 1.6vw, 1.2rem) clamp(1rem, 2vw, 1.75rem); background: #000; border-bottom: 3px solid #000; }
    .disp__logo { width: clamp(3.2rem, 6vw, 5rem); height: clamp(3.2rem, 6vw, 5rem); border-radius: 50%; background: #fff; padding: clamp(0.25rem, 0.5vw, 0.4rem); box-shadow: 0 0 0 3px #000, 0 0 0 5px rgba(255,255,255,0.15); object-fit: contain; }
    .disp__logo--r { justify-self: end; }
    .disp__hero__title { text-align: center; }
    .disp__eyebrow { text-transform: uppercase; letter-spacing: 0.4em; color: #fff; font-weight: 800; font-size: clamp(0.65rem, 1vw, 0.9rem); }
    .disp__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(1.9rem, 4.6vw, 3.8rem); margin: 0.1em 0 0; line-height: 1; letter-spacing: 0.01em; color: #fff; }
    .disp__sub { color: rgba(255,255,255,0.75); font-size: clamp(0.85rem, 1.3vw, 1.1rem); margin: 0.15em 0 0; font-style: italic; }

    .disp__strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(0.35rem, 0.8vw, 0.7rem); padding: clamp(0.4rem, 1vw, 0.75rem) clamp(0.8rem, 1.8vw, 1.4rem); }
    .disp__strip--stacked { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr)); }
    .disp__ftot { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: clamp(0.4rem, 0.9vw, 0.75rem); text-align: center; }
    .disp__ftot__name { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; font-size: clamp(0.65rem, 1vw, 0.85rem); color: var(--muted); }
    .disp__ftot__amt { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(1.35rem, 2.6vw, 2.2rem); line-height: 1.05; color: var(--gold); margin-top: 0.15em; }
    .disp__ftot__count { color: var(--muted); font-size: clamp(0.7rem, 0.95vw, 0.85rem); margin-top: 0.05em; }
    .disp__ftot--grand { background: rgba(245,197,66,0.12); border-color: rgba(245,197,66,0.5); }
    .disp__ftot--grand .disp__ftot__name { color: var(--gold); }
    .disp__ftot--now { background: rgba(230,67,57,0.14); border-color: rgba(230,67,57,0.55); }
    .disp__ftot--now .disp__ftot__name { color: #ff7a70; }
    .disp__ftot__amt--now { font-family: "Fraunces", Georgia, serif; font-size: clamp(1.05rem, 1.9vw, 1.6rem); color: #fff; line-height: 1.1; }
    .disp__ftot--current { outline: 2px solid var(--gold); outline-offset: -2px; }

    /* Slim nav strip under the hero -- matches the leaderboard display so
       any Founders public page has the same one-tap nav to its siblings. */
    .disp__nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 0.75rem 1rem; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--line); }
    .disp__nav a { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.95rem; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--ink); font-weight: 700; text-decoration: none; font-size: clamp(0.85rem, 1.1vw, 1rem); letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease, color 0.15s ease; }
    .disp__nav a:hover, .disp__nav a:focus-visible { background: var(--gold); color: #0b1a10; border-color: var(--gold); outline: none; }
    .disp__nav a.is-here { background: rgba(245,197,66,0.15); color: var(--gold); border-color: rgba(245,197,66,0.35); pointer-events: none; }
    .disp__nav-emoji { font-size: 1.1em; line-height: 1; }

    .disp__body { flex: 1; padding: clamp(0.4rem, 1vw, 0.8rem) clamp(0.8rem, 1.8vw, 1.4rem) 3rem; }

    /* Band = "Available" or "Sold" header + section list. */
    .band { margin-top: clamp(0.5rem, 1vw, 0.8rem); }
    .band__hdr { display: flex; justify-content: space-between; align-items: baseline; padding: 0.35rem 0.4rem 0.4rem; border-bottom: 2px solid var(--line); margin-bottom: 0.55rem; }
    .band__hdr h2 { font-family: "Fraunces", Georgia, serif; font-weight: 700; margin: 0; font-size: clamp(1.05rem, 1.9vw, 1.6rem); }
    .band__hdr .band__meta { color: var(--muted); font-size: clamp(0.75rem, 1.05vw, 0.95rem); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
    .band--sold { opacity: 0.9; }
    .band--sold .band__hdr h2 { color: var(--gold); }

    /* Sections inside a band. If flights are assigned, one section per flight;
       otherwise a single "All teams" section. */
    .sec { margin-bottom: 0.9rem; }
    .sec__hdr { display: flex; justify-content: space-between; align-items: baseline; padding: 0 0.2rem 0.2rem; border-bottom: 1px dashed var(--line); margin-bottom: 0.35rem; }
    .sec__hdr h3 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(0.95rem, 1.4vw, 1.2rem); color: var(--ink); }
    .sec__hdr .sec__meta { color: var(--muted); font-size: clamp(0.75rem, 1vw, 0.9rem); }

    /* DENSE grid — designed to fit 64 team cards on one 1080p screen. */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(14rem, 100%), 1fr)); gap: clamp(0.25rem, 0.5vw, 0.4rem); }
    .grid--sold { grid-template-columns: repeat(auto-fill, minmax(min(15rem, 100%), 1fr)); }

    .team { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0.45rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.35rem 0.55rem; }
    .team__tnum { background: #fff; color: #0b1a10; font-weight: 800; padding: 0.1rem 0.4rem; border-radius: 5px; font-size: clamp(0.7rem, 0.95vw, 0.85rem); letter-spacing: 0.05em; min-width: 2.8rem; text-align: center; }
    .team__name { font-weight: 700; font-size: clamp(0.85rem, 1.15vw, 1rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Sold cards: red-tinted background + muted text, no buyer info shown.
       Public viewers only see whether a team is still available. */
    .team--sold { background: rgba(230,67,57,0.16); border-color: rgba(230,67,57,0.5); color: rgba(246,249,244,0.55); }
    .team--sold .team__tnum { background: rgba(230,67,57,0.85); color: #fff; }
    .team--sold .team__name { text-decoration: line-through; text-decoration-color: rgba(246,249,244,0.35); }
    .team--sold::after { content: "SOLD"; color: #fff; background: var(--red); font-size: 0.6rem; font-weight: 800; letter-spacing: 0.15em; padding: 0.1rem 0.35rem; border-radius: 4px; margin-left: auto; }
    .team--sold { grid-template-columns: auto 1fr auto; }

    .disp__empty-msg { text-align: center; color: var(--muted); padding: 1.5rem 1rem; font-style: italic; }
    .disp__empty-msg--all { padding: 3rem 1rem; font-size: 1.3rem; color: var(--green); font-style: normal; font-weight: 700; }

    .disp__foot { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 0.4rem 1rem 0.8rem; letter-spacing: 0.08em; }
    .disp__foot .live-dot { display: inline-block; width: 0.55rem; height: 0.55rem; background: var(--green); border-radius: 50%; margin-right: 0.35rem; vertical-align: middle; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    body.idle { cursor: none; }
    @media (max-width: 720px) {
      .disp__strip { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
      .disp__hero { grid-template-columns: 1fr; text-align: center; padding-top: 1rem; }
      .disp__logo { margin: 0 auto; }
      .disp__logo--r { display: none; }
    }

    /* "Show QR" button pinned to the top-right of the hero. Small footprint,
       big effect — click it before the auction to fill the screen with the
       scannable QR code + URL. */
    .disp__qrbtn { position: absolute; top: 0.9rem; right: 1rem; background: var(--gold); color: #0b1a10; border: none; border-radius: 999px; padding: 0.5rem 1.1rem; font-family: inherit; font-weight: 800; letter-spacing: 0.05em; font-size: 0.95rem; cursor: pointer; z-index: 3; box-shadow: 0 6px 22px rgba(0,0,0,0.4); }
    .disp__qrbtn:hover { background: #fff; }
    .disp__hero { position: relative; }
    @media (max-width: 720px) { .disp__qrbtn { position: static; margin: 0.5rem auto 0; } }

    /* Fullscreen QR showcase overlay. Absolute top layer with a big centered
       QR canvas and the URL underneath in large type as a fallback if a
       phone camera can't lock onto the code. */
    .qrshow { position: fixed; inset: 0; background: rgba(6,12,8,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; padding: clamp(1rem, 4vw, 3rem); text-align: center; }
    .qrshow.is-open { display: flex; }
    .qrshow__eyebrow { color: var(--gold); font-weight: 800; letter-spacing: 0.4em; text-transform: uppercase; font-size: clamp(0.9rem, 1.4vw, 1.15rem); margin-bottom: 0.5rem; }
    .qrshow__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2rem, 4.5vw, 3.6rem); margin: 0 0 0.4em; color: #fff; line-height: 1.05; }
    .qrshow__card { background: #fff; padding: clamp(1rem, 2vw, 1.5rem); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.7); }
    .qrshow__canvas, .qrshow__img { display: block; width: min(60vh, 60vmin); height: min(60vh, 60vmin); image-rendering: pixelated; }
    .qrshow__url { color: #fff; font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; font-weight: 700; letter-spacing: 0.02em; font-size: clamp(1.1rem, 2.2vw, 1.8rem); margin-top: clamp(1rem, 2vw, 1.5rem); word-break: break-all; }
    .qrshow__hint { color: rgba(255,255,255,0.7); font-size: clamp(0.9rem, 1.3vw, 1.1rem); margin-top: 0.7rem; font-style: italic; }
    .qrshow__close { position: absolute; top: 1rem; right: 1.2rem; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; width: 3rem; height: 3rem; font-size: 1.5rem; cursor: pointer; }
    .qrshow__close:hover { background: rgba(255,255,255,0.18); }
    .qrshow__err { color: rgba(255,255,255,0.7); text-align: center; padding: 2rem; font-style: italic; }
  </style>
</head>
<body>
  <main class="disp" role="main">
    <header class="disp__hero">
      <img class="disp__logo" src="images/logo.png" alt="F&H Golf Course" />
      <div class="disp__hero__title">
        <div class="disp__eyebrow">Live Calcutta Auction</div>
        <h1 class="disp__title">2026 Founders</h1>
        <p class="disp__sub">F&amp;H Golf Course · Aug 8&ndash;9</p>
      </div>
      <img class="disp__logo disp__logo--r" src="images/logo.png" alt="" aria-hidden="true" />
      <button class="disp__qrbtn" type="button" id="qrShowBtn">Show QR</button>
    </header>

    <div class="qrshow" id="qrShow" role="dialog" aria-modal="true" aria-label="Scan to open live Calcutta auction">
      <button class="qrshow__close" type="button" id="qrShowClose" aria-label="Close">×</button>
      <div class="qrshow__eyebrow">Scan to Join</div>
      <h2 class="qrshow__title">Live Calcutta Auction</h2>
      <div class="qrshow__card" id="qrShowCard">
        <canvas class="qrshow__canvas" id="qrShowCanvas"></canvas>
      </div>
      <div class="qrshow__url" id="qrShowUrl"></div>
      <div class="qrshow__hint">Point your phone camera at the code &mdash; or type the URL into any browser.</div>
    </div>

    <nav class="disp__nav" aria-label="Founders public pages">
      <a href="index.html"><span class="disp__nav-emoji" aria-hidden="true">🏠</span> F&amp;H Home</a>
      <a href="tournaments.html"><span class="disp__nav-emoji" aria-hidden="true">📅</span> Tournaments</a>
      <a class="is-here" href="founders-calcutta-display.html" aria-current="page"><span class="disp__nav-emoji" aria-hidden="true">💰</span> Calcutta</a>
      <a href="founders-recap.html"><span class="disp__nav-emoji" aria-hidden="true">📝</span> Recap</a>
      <a href="founders-leaderboard-display.html"><span class="disp__nav-emoji" aria-hidden="true">🏆</span> Leaderboard</a>
    </nav>

    <div class="disp__strip" id="dispStrip"></div>

    <section class="disp__body" id="dispBody">
      <p class="disp__empty-msg">Loading auction board&hellip;</p>
    </section>

    <footer class="disp__foot"><span class="live-dot"></span><span id="dispLast">Loading&hellip;</span></footer>
  </main>

  <script src="js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
  <script>
    /* "Show QR" — fullscreen scan card. Generates the QR code locally via
       qrcode.js (jsdelivr). If the CDN is blocked and the library never
       loads, the URL below the QR area is still legible and the auction
       can proceed with a typed-in address. Bound to the button, ESC, and
       backdrop clicks. */
    (function () {
      var btn = document.getElementById("qrShowBtn");
      var modal = document.getElementById("qrShow");
      var closeBtn = document.getElementById("qrShowClose");
      var canvas = document.getElementById("qrShowCanvas");
      var card = document.getElementById("qrShowCard");
      var urlEl = document.getElementById("qrShowUrl");
      if (!btn || !modal) return;
      var pageUrl = location.origin + location.pathname;
      urlEl.textContent = pageUrl.replace(/^https?:\/\//, "");
      var rendered = false;
      function open() {
        modal.classList.add("is-open");
        // First open: try to draw the QR. If qrcode.js isn't loaded yet
        // (slow network), retry once after a beat before giving up.
        if (rendered) return;
        function draw() {
          if (typeof QRCode === "undefined" || !QRCode.toCanvas) {
            card.innerHTML = '<div class="qrshow__err">QR generator didn’t load &mdash; use the URL below.</div>';
            return;
          }
          QRCode.toCanvas(canvas, pageUrl, { width: 640, margin: 1, color: { dark: "#0b1a10", light: "#ffffff" } }, function (err) {
            if (err) { card.innerHTML = '<div class="qrshow__err">Couldn’t draw QR &mdash; use the URL below.</div>'; }
          });
          rendered = true;
        }
        if (typeof QRCode === "undefined") { setTimeout(draw, 400); } else { draw(); }
      }
      function close() { modal.classList.remove("is-open"); }
      btn.addEventListener("click", open);
      closeBtn.addEventListener("click", close);
      modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && modal.classList.contains("is-open")) close(); });
    })();

    (function () {
      var KEY = "Founder's Tournament (Aug 8–9)";
      function flightName(n) {
        var names = ["Champ", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh"];
        return names[n - 1] || ("Flight " + n);
      }
      var REFRESH_MS = 15000;

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function money(n) { if (n == null || !isFinite(n)) return "$0"; return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
      function teamShortNames(f) {
        function shrt(n) { n = String(n || "").trim(); if (!n) return ""; var parts = n.split(/\s+/); if (parts.length === 1) return parts[0]; return parts[0].charAt(0).toUpperCase() + ". " + parts[parts.length - 1]; }
        var p1 = shrt(f["Player Name"]);
        var partners = String(f["Team / Partners"] || "").split(/\s*[\/,&]\s*|\s+and\s+/i).map(shrt).filter(Boolean);
        return [p1].concat(partners).filter(Boolean).join(" / ");
      }
      function computeTeamNumbers(recs) {
        var out = {}; var n = 0;
        ["8 AM", "1 PM", ""].forEach(function (w) {
          var arr = (recs || []).filter(function (r) { var f = r.fields || {}; return (f.Start || "") === w && !(f.Alternate === true || String(f.Alternate) === "true"); }).sort(function (a, b) { return String(a.created || "").localeCompare(String(b.created || "")); });
          arr.forEach(function (r) { out[r.id] = ++n; });
        });
        return out;
      }
      // Public API returns pre-computed sold flag; buyer + bid never leave the server.
      function isSold(r) { return (r.fields || {}).sold === true; }

      function fetchAll() {
        return fetch(FH_API.url("/api/tournament-signups"), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j || !j.ok) throw new Error(j && j.error || "Load failed"); return j; });
      }

      function teamCard(r, teamNumbers, sold) {
        var f = r.fields || {};
        var tn = teamNumbers[r.id];
        var badge = tn ? ('T-' + String(tn).padStart(2, "0")) : '—';
        var name = teamShortNames(f);
        // Public view: team + status only. Buyer + winning bid are staff-only.
        return '<div class="team' + (sold ? ' team--sold' : '') + '">'
          + '<span class="team__tnum">' + esc(badge) + '</span>'
          + '<span class="team__name">' + esc(name) + '</span></div>';
      }

      function sectionsFor(recs, teamNumbers, sold, hasFlights, pools) {
        if (!hasFlights) {
          if (!recs.length) return "";
          var cards = recs.map(function (r) { return teamCard(r, teamNumbers, sold); }).join("");
          var meta = recs.length + (recs.length === 1 ? ' team' : ' teams');
          return '<div class="sec"><div class="sec__hdr"><h3>All Teams</h3><span class="sec__meta">' + meta + '</span></div><div class="grid">' + cards + '</div></div>';
        }
        var groups = {};
        recs.forEach(function (r) { var fl = Number((r.fields || {}).Flight); (groups[fl] = groups[fl] || []).push(r); });
        var _mx = Math.max(4, Object.keys(groups).reduce(function (m, k) { return Number(k) > m ? Number(k) : m; }, 0));
        var _range = []; for (var _ri = 1; _ri <= _mx; _ri++) _range.push(_ri);
        return _range.map(function (fl) {
          var arr = groups[fl] || []; if (!arr.length) return "";
          var cards = arr.map(function (r) { return teamCard(r, teamNumbers, sold); }).join("");
          var meta = arr.length + (arr.length === 1 ? ' team' : ' teams');
          if (sold && pools && pools[fl]) meta += ' · ' + money(pools[fl]);
          return '<div class="sec"><div class="sec__hdr"><h3>' + esc(flightName(fl)) + ' Flight</h3><span class="sec__meta">' + meta + '</span></div><div class="grid">' + cards + '</div></div>';
        }).join("");
      }

      function render(payload) {
        var records = payload.records || [];
        var totals = (payload.totals && payload.totals[KEY]) || { pools: {}, sold: {}, teams: {} };
        var recs = records.filter(function (r) { var f = r.fields || {}; if (f.Tournament !== KEY) return false; if (f.Alternate === true || String(f.Alternate) === "true") return false; return true; });
        var teamNumbers = computeTeamNumbers(recs);

        // Auction state — set by staff on the Calcutta tab. "pol" (or missing)
        // shows the whole field (Pick of the Litter). Any flight number
        // filters the display to only teams in that flight. "done" hides team
        // lists once the auction is complete.
        var aState = (payload.auctionStates && payload.auctionStates[KEY]) || {};
        var currentFlight = aState.flight != null ? String(aState.flight) : "pol";
        var auctionMode = "pol";
        var filterFlight = null;
        if (currentFlight === "done") { auctionMode = "done"; }
        else if (currentFlight !== "pol" && currentFlight !== "") {
          var fn = Number(currentFlight);
          if (isFinite(fn) && fn >= 1) { auctionMode = "flight"; filterFlight = fn; }
        }
        if (auctionMode === "flight") {
          recs = recs.filter(function (r) { return Number((r.fields || {}).Flight) === filterFlight; });
        }

        // Are flights assigned? Drives strip layout + section grouping.
        var _tKeys = Object.keys(totals.teams || {}).map(Number);
        var maxFlight = Math.max(4, _tKeys.reduce(function (m, k) { return k > m ? k : m; }, 0));
        var flightRange = []; for (var _fi = 1; _fi <= maxFlight; _fi++) flightRange.push(_fi);
        var hasFlights = flightRange.some(function (fl) { return (totals.teams[fl] || 0) > 0; });

        // Aggregate pool numbers come straight from the server so per-team bids
        // never touch the client.
        var pools = totals.pools || {};
        var soldCounts = totals.sold || {};
        var teamCounts = totals.teams || {};
        var grandPool = Object.keys(pools).reduce(function (a, k) { return a + (pools[k] || 0); }, 0);
        var grandSold = Object.keys(soldCounts).reduce(function (a, k) { return a + (soldCounts[k] || 0); }, 0);

        var strip = document.getElementById("dispStrip");
        var stripHtml = "";
        // "Currently auctioning" pill leads the strip so the room knows what's
        // on the block at a glance.
        var modeLabel = auctionMode === "flight"
          ? (esc(flightName(filterFlight)) + " Flight")
          : (auctionMode === "done" ? "Complete" : "Pick of the Litter");
        var modeSub = auctionMode === "flight"
          ? "flight-by-flight round"
          : (auctionMode === "done" ? "auction closed" : "whole field — buy any team");
        stripHtml += '<div class="disp__ftot disp__ftot--now"><div class="disp__ftot__name">Now Auctioning</div>'
          + '<div class="disp__ftot__amt disp__ftot__amt--now">' + modeLabel + '</div>'
          + '<div class="disp__ftot__count">' + modeSub + '</div></div>';
        if (hasFlights) {
          strip.classList.remove("disp__strip--stacked");
          stripHtml += flightRange.map(function (fl) {
            var tot = teamCounts[fl] || 0;
            var sold = soldCounts[fl] || 0;
            var pool = pools[fl] || 0;
            var isCurrent = auctionMode === "flight" && filterFlight === fl;
            return '<div class="disp__ftot' + (isCurrent ? ' disp__ftot--current' : '') + '"><div class="disp__ftot__name">' + esc(flightName(fl)) + ' Flight</div>'
              + '<div class="disp__ftot__amt">' + money(pool) + '</div>'
              + '<div class="disp__ftot__count">' + sold + ' / ' + tot + ' sold</div></div>';
          }).join("");
        } else {
          strip.classList.add("disp__strip--stacked");
          stripHtml += '<div class="disp__ftot"><div class="disp__ftot__name">All Flights</div>'
            + '<div class="disp__ftot__amt">' + money(grandPool) + '</div>'
            + '<div class="disp__ftot__count">' + grandSold + ' / ' + records.length + ' sold · flights not cut yet</div></div>';
        }
        stripHtml += '<div class="disp__ftot disp__ftot--grand"><div class="disp__ftot__name">Total Pool</div>'
          + '<div class="disp__ftot__amt">' + money(grandPool) + '</div>'
          + '<div class="disp__ftot__count">' + grandSold + ' / ' + records.length + ' sold</div></div>';
        strip.innerHTML = stripHtml;

        var body = document.getElementById("dispBody");
        if (auctionMode === "done") {
          body.innerHTML = '<p class="disp__empty-msg disp__empty-msg--all">Auction complete &mdash; thanks everyone!</p>';
          return;
        }
        if (!recs.length) {
          var msg = auctionMode === "flight"
            ? "No teams in " + esc(flightName(filterFlight)) + " Flight yet."
            : "No teams registered yet.";
          body.innerHTML = '<p class="disp__empty-msg">' + msg + '</p>';
          return;
        }

        var available = recs.filter(function (r) { return !isSold(r); });
        var sold = recs.filter(isSold);
        available.sort(function (a, b) { return (teamNumbers[a.id] || 999) - (teamNumbers[b.id] || 999); });
        sold.sort(function (a, b) { return (teamNumbers[a.id] || 999) - (teamNumbers[b.id] || 999); });

        // When auctioning a single flight, force the section renderer into
        // "no-flights" grouping so we don't repeat the flight name inside the
        // Available band header — it's already announced in the strip.
        var groupByFlight = hasFlights && auctionMode !== "flight";

        var html = "";
        if (available.length) {
          var scope = auctionMode === "flight" ? esc(flightName(filterFlight)) + " Flight" : "up for bid";
          html += '<div class="band band--avail"><div class="band__hdr"><h2>Available</h2><span class="band__meta">' + available.length + ' teams · ' + scope + '</span></div>' + sectionsFor(available, teamNumbers, false, groupByFlight, pools) + '</div>';
        } else {
          var doneMsg = auctionMode === "flight"
            ? esc(flightName(filterFlight)) + " Flight is fully sold — ready to move on."
            : "All teams sold. Enjoy the auction!";
          html += '<p class="disp__empty-msg disp__empty-msg--all">' + doneMsg + '</p>';
        }
        if (sold.length) {
          html += '<div class="band band--sold"><div class="band__hdr"><h2>Sold</h2><span class="band__meta">' + sold.length + ' teams</span></div>' + sectionsFor(sold, teamNumbers, true, groupByFlight, pools) + '</div>';
        }
        body.innerHTML = html;
      }

      function updateFooter() {
        var t = new Date();
        var hh = t.getHours(), mm = t.getMinutes();
        var h12 = ((hh + 11) % 12) + 1;
        var ap = hh >= 12 ? "PM" : "AM";
        document.getElementById("dispLast").textContent = "LIVE · Updated " + h12 + ":" + (mm < 10 ? "0" : "") + mm + " " + ap;
      }

      function refresh() {
        fetchAll().then(render).then(updateFooter).catch(function (e) {
          console.error("calcutta display fetch", e);
          document.getElementById("dispLast").textContent = "Connection lost — retrying…";
        });
      }
      refresh();
      setInterval(refresh, REFRESH_MS);

      var idleT = null;
      function nudge() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add("idle"); }, 4000); }
      ["mousemove", "keydown", "touchstart"].forEach(function (ev) { window.addEventListener(ev, nudge, { passive: true }); });
      nudge();
    })();
  </script>
</body>
</html>
