<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Founders — Calcutta Auction</title>
  <meta name="description" content="Live Calcutta auction board for the F&H Golf Founders Tournament." />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <meta name="theme-color" content="#0b1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a10;
      --bg-2: #12261a;
      --panel: rgba(255,255,255,0.06);
      --panel-2: rgba(255,255,255,0.10);
      --line: rgba(255,255,255,0.14);
      --gold: #f5c542;
      --green: #3fbc6b;
      --red: #e64339;
      --ink: #f6f9f4;
      --muted: rgba(246,249,244,0.62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
    body { background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 60%); }

    .disp { min-height: 100vh; display: flex; flex-direction: column; }
    .disp__hero { text-align: center; padding: clamp(0.75rem, 2vw, 1.5rem) 1rem 0.5rem; }
    .disp__eyebrow { font-family: "Source Sans 3", sans-serif; text-transform: uppercase; letter-spacing: 0.35em; color: var(--gold); font-weight: 700; font-size: clamp(0.75rem, 1.2vw, 0.95rem); }
    .disp__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2.4rem, 6vw, 5.2rem); margin: 0.15em 0 0.05em; line-height: 1; letter-spacing: 0.01em; }
    .disp__sub { color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.3rem); margin: 0; }

    .disp__strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(0.4rem, 1vw, 0.9rem); padding: clamp(0.5rem, 1.4vw, 1rem) clamp(0.8rem, 2vw, 1.6rem); }
    .disp__flight-tot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: clamp(0.5rem, 1.2vw, 1rem); text-align: center; }
    .disp__flight-tot__name { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; font-size: clamp(0.75rem, 1.15vw, 0.95rem); color: var(--muted); }
    .disp__flight-tot__amt { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(1.8rem, 3.4vw, 3rem); line-height: 1.05; color: var(--gold); margin-top: 0.15em; }
    .disp__flight-tot__count { color: var(--muted); font-size: clamp(0.8rem, 1.05vw, 0.95rem); margin-top: 0.1em; }
    .disp__flight-tot--grand { background: rgba(245,197,66,0.12); border-color: rgba(245,197,66,0.5); }
    .disp__flight-tot--grand .disp__flight-tot__name { color: #f5c542; }

    .disp__body { flex: 1; padding: clamp(0.5rem, 1.4vw, 1rem) clamp(0.8rem, 2vw, 1.6rem) 3rem; }
    .disp__section-h { display: flex; justify-content: space-between; align-items: baseline; margin: clamp(0.8rem, 1.5vw, 1.2rem) 0 0.5rem; padding: 0 0.2rem; border-bottom: 1px solid var(--line); }
    .disp__section-h h2 { font-family: "Fraunces", Georgia, serif; font-weight: 700; margin: 0; font-size: clamp(1.3rem, 2.2vw, 2rem); }
    .disp__section-h .disp__pool { color: var(--gold); font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.4rem); }

    .disp__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(22rem, 100%), 1fr)); gap: clamp(0.35rem, 0.8vw, 0.6rem); }
    .disp__team { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0.75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: clamp(0.55rem, 1.1vw, 0.85rem) clamp(0.7rem, 1.3vw, 1rem); }
    .disp__tnum { background: #fff; color: #0b1a10; font-weight: 800; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: clamp(0.85rem, 1.15vw, 1rem); font-family: "Source Sans 3", monospace; letter-spacing: 0.05em; min-width: 3.4rem; text-align: center; }
    .disp__team-name { font-weight: 700; font-size: clamp(1rem, 1.5vw, 1.35rem); }

    .disp__empty-msg { text-align: center; color: var(--muted); padding: 2rem 1rem; font-style: italic; }
    .disp__empty-msg--all { padding: 4rem 1rem; font-size: 1.4rem; color: var(--green); font-style: normal; font-weight: 700; }

    .disp__foot { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0.6rem 1rem 1.2rem; letter-spacing: 0.08em; }
    .disp__foot .live-dot { display: inline-block; width: 0.55rem; height: 0.55rem; background: var(--green); border-radius: 50%; margin-right: 0.35rem; vertical-align: middle; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Hide the cursor on TV displays after inactivity. */
    body.idle { cursor: none; }

    @media (max-width: 720px) {
      .disp__strip { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .disp__strip { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="disp" role="main">
    <header class="disp__hero">
      <div class="disp__eyebrow">Live Calcutta Auction</div>
      <h1 class="disp__title">2026 Founders</h1>
      <p class="disp__sub" id="dispSub">F&amp;H Golf Course · Aug 8&ndash;9</p>
    </header>

    <div class="disp__strip" id="dispStrip"></div>

    <section class="disp__body" id="dispBody">
      <p class="disp__empty-msg">Loading auction board&hellip;</p>
    </section>

    <footer class="disp__foot"><span class="live-dot"></span><span id="dispLast">Loading&hellip;</span></footer>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var KEY = "Founder's Tournament (Aug 8–9)";
      var FLIGHT_NAMES = { 1: "Champ", 2: "First", 3: "Second", 4: "Third" };
      var REFRESH_MS = 15000;

      // ---- utilities ----
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function money(n) { if (n == null || !isFinite(n)) return "$0"; return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
      function teamShortNames(f) {
        // "First-initial . Last" for each partner where possible, joined with " / ".
        function shrt(n) {
          n = String(n || "").trim(); if (!n) return "";
          var parts = n.split(/\s+/);
          if (parts.length === 1) return parts[0];
          return parts[0].charAt(0).toUpperCase() + ". " + parts[parts.length - 1];
        }
        var p1 = shrt(f["Player Name"]);
        var partners = String(f["Team / Partners"] || "").split(/\s*[\/,&]\s*|\s+and\s+/i).map(shrt).filter(Boolean);
        var joined = [p1].concat(partners).filter(Boolean);
        return joined.join(" / ");
      }
      // Team numbers: AM = 1..N by created order; PM restarts at 1.
      function computeTeamNumbers(recs) {
        var out = {};
        ["8 AM", "1 PM"].forEach(function (w) {
          var arr = (recs || []).filter(function (r) {
            var f = r.fields || {};
            return (f.Start || "") === w && !(f.Alternate === true || String(f.Alternate) === "true");
          }).sort(function (a, b) { return String(a.created || "").localeCompare(String(b.created || "")); });
          arr.forEach(function (r, i) { out[r.id] = i + 1; });
        });
        return out;
      }

      function fetchAll() {
        return fetch(FH_API.url("/api/tournament-signups"), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j || !j.ok) throw new Error(j && j.error || "Load failed"); return j.records || []; });
      }

      function render(records) {
        var recs = records.filter(function (r) {
          var f = r.fields || {};
          if (f.Tournament !== KEY) return false;
          if (f.Alternate === true || String(f.Alternate) === "true") return false;
          return true;
        });
        var teamNumbers = computeTeamNumbers(recs);

        // Group by flight.
        var groups = { 0: [], 1: [], 2: [], 3: [], 4: [] };
        recs.forEach(function (r) {
          var fl = (r.fields || {}).Flight;
          var k = (fl != null && fl !== "") ? Number(fl) : 0;
          if (!groups[k]) groups[k] = [];
          groups[k].push(r);
        });

        // Pool per flight = sum of Buy Amount.
        var pools = {};
        var grand = 0;
        [1, 2, 3, 4].forEach(function (fl) {
          var arr = groups[fl] || [];
          var pool = arr.reduce(function (acc, r) { var v = (r.fields || {})["Buy Amount"]; return acc + (typeof v === "number" ? v : 0); }, 0);
          pools[fl] = pool; grand += pool;
        });

        // Top strip.
        var strip = document.getElementById("dispStrip");
        var stripHtml = [1, 2, 3, 4].map(function (fl) {
          var arr = groups[fl] || [];
          var sold = arr.filter(function (r) { return String((r.fields || {}).Buyer || "").trim() !== ""; }).length;
          return '<div class="disp__flight-tot"><div class="disp__flight-tot__name">' + esc(FLIGHT_NAMES[fl]) + ' Flight</div>'
            + '<div class="disp__flight-tot__amt">' + money(pools[fl]) + '</div>'
            + '<div class="disp__flight-tot__count">' + sold + ' / ' + arr.length + ' sold</div></div>';
        }).join("") + '<div class="disp__flight-tot disp__flight-tot--grand"><div class="disp__flight-tot__name">Total Pool</div>'
          + '<div class="disp__flight-tot__amt">' + money(grand) + '</div>'
          + '<div class="disp__flight-tot__count">across all flights</div></div>';
        strip.innerHTML = stripHtml;

        // Available-teams sections (Buyer empty), one per flight.
        var body = document.getElementById("dispBody");
        var totalAvail = 0;
        var sections = [1, 2, 3, 4].map(function (fl) {
          var arr = (groups[fl] || []).filter(function (r) { return String((r.fields || {}).Buyer || "").trim() === ""; });
          arr.sort(function (a, b) { return (teamNumbers[a.id] || 999) - (teamNumbers[b.id] || 999); });
          totalAvail += arr.length;
          if (!arr.length) {
            return '<div class="disp__section-h"><h2>' + esc(FLIGHT_NAMES[fl]) + ' Flight</h2><span class="disp__pool">' + money(pools[fl]) + ' pool</span></div>'
              + '<p class="disp__empty-msg">All ' + esc(FLIGHT_NAMES[fl]) + ' teams sold.</p>';
          }
          var cards = arr.map(function (r) {
            var f = r.fields || {};
            var tn = teamNumbers[r.id];
            var badge = tn ? ('T-' + String(tn).padStart(2, "0")) : '—';
            return '<div class="disp__team"><span class="disp__tnum">' + esc(badge) + '</span>'
              + '<span class="disp__team-name">' + esc(teamShortNames(f)) + '</span></div>';
          }).join("");
          return '<div class="disp__section-h"><h2>' + esc(FLIGHT_NAMES[fl]) + ' Flight</h2><span class="disp__pool">' + money(pools[fl]) + ' pool · ' + arr.length + ' available</span></div>'
            + '<div class="disp__grid">' + cards + '</div>';
        });

        // Unassigned teams (before flights are cut on Day 1).
        var una = (groups[0] || []).filter(function (r) { return String((r.fields || {}).Buyer || "").trim() === ""; });
        if (una.length) {
          una.sort(function (a, b) { return (teamNumbers[a.id] || 999) - (teamNumbers[b.id] || 999); });
          totalAvail += una.length;
          var cards = una.map(function (r) {
            var f = r.fields || {};
            var tn = teamNumbers[r.id];
            var badge = tn ? ('T-' + String(tn).padStart(2, "0")) : '—';
            return '<div class="disp__team"><span class="disp__tnum">' + esc(badge) + '</span>'
              + '<span class="disp__team-name">' + esc(teamShortNames(f)) + '</span></div>';
          }).join("");
          sections.push('<div class="disp__section-h"><h2>Unassigned</h2><span class="disp__pool">' + una.length + ' teams</span></div>'
            + '<div class="disp__grid">' + cards + '</div>');
        }

        if (totalAvail === 0 && recs.length > 0) {
          body.innerHTML = '<p class="disp__empty-msg disp__empty-msg--all">All teams sold. Enjoy the auction!</p>';
        } else if (recs.length === 0) {
          body.innerHTML = '<p class="disp__empty-msg">No teams registered yet.</p>';
        } else {
          body.innerHTML = sections.join("");
        }
      }

      function updateFooter() {
        var t = new Date();
        var hh = t.getHours(), mm = t.getMinutes();
        var h12 = ((hh + 11) % 12) + 1;
        var ap = hh >= 12 ? "PM" : "AM";
        document.getElementById("dispLast").textContent = "LIVE · Updated " + h12 + ":" + (mm < 10 ? "0" : "") + mm + " " + ap;
      }

      function refresh() {
        fetchAll().then(render).then(updateFooter).catch(function (e) {
          console.error("calcutta display fetch", e);
          document.getElementById("dispLast").textContent = "Connection lost — retrying…";
        });
      }
      refresh();
      setInterval(refresh, REFRESH_MS);

      // Hide cursor after idle.
      var idleT = null;
      function nudge() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add("idle"); }, 4000); }
      ["mousemove", "keydown", "touchstart"].forEach(function (ev) { window.addEventListener(ev, nudge, { passive: true }); });
      nudge();
    })();
  </script>
</body>
</html>
