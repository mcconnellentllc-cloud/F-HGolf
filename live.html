<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Live Scoring — F&amp;H Golf</title>
  <meta name="theme-color" content="#17472A" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/logo.png" />
  <link rel="manifest" href="site.webmanifest" />
  <style>
    :root {
      --paper: #f6f2e8;
      --paper-2: #ede7d6;
      --card: #ffffff;
      --line: #d8d1bd;
      --ink: #1b2618;
      --ink-2: #3a4732;
      --muted: #7a7663;
      --green: #17472A;
      --green-strong: #17472A;
      --green-soft: #dfe7dc;
      --brass: #a37f30;
      --brass-soft: #f4e6c1;
      --danger: #b11e2d;
      --danger-soft: #f5d6d9;
      --live: #d43a2d;
      --you: #fff8e1;
      --shadow: 0 1px 2px rgba(23,71,42,0.06), 0 4px 12px rgba(23,71,42,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #10160e;
        --paper-2: #171e13;
        --card: #1e2618;
        --line: #2d3722;
        --ink: #e9e3cd;
        --ink-2: #c8c2a9;
        --muted: #8f8a76;
        --green: #7db997;
        --green-strong: #7db997;
        --green-soft: #223122;
        --brass: #d0ac66;
        --brass-soft: #3a2e18;
        --danger: #ea919a;
        --danger-soft: #3b1e21;
        --live: #ef7069;
        --you: #2f2a15;
        --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
      }
    }
    :root[data-theme="dark"] {
      --paper: #10160e;
      --paper-2: #171e13;
      --card: #1e2618;
      --line: #2d3722;
      --ink: #e9e3cd;
      --ink-2: #c8c2a9;
      --muted: #8f8a76;
      --green: #7db997;
      --green-strong: #7db997;
      --green-soft: #223122;
      --brass: #d0ac66;
      --brass-soft: #3a2e18;
      --danger: #ea919a;
      --danger-soft: #3b1e21;
      --live: #ef7069;
      --you: #2f2a15;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

    /* App header — F&H logo + tournament name */
    .app-hd {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.85rem 1rem 0.75rem;
      padding-top: calc(0.85rem + env(safe-area-inset-top));
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
    }
    .app-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px var(--brass); }
    .app-title { flex: 1; min-width: 0; }
    .app-title .t { font: 500 0.98rem/1.15 Georgia, "Iowan Old Style", serif; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-title .sub { font: 400 0.75rem/1.3 system-ui, sans-serif; color: var(--muted); margin-top: 0.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--live);
      white-space: nowrap;
    }
    .live::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(212,58,45,0.18);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .live.saving::before { background: var(--brass); box-shadow: 0 0 0 3px rgba(163,127,48,0.2); }
    .live.saved::before { background: var(--green-strong); box-shadow: 0 0 0 3px rgba(23,71,42,0.15); animation: none; }
    .live.err::before { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

    /* Tabs */
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .tab {
      padding: 0.85rem 0.5rem;
      font: 600 0.9rem/1 system-ui, sans-serif;
      text-align: center;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      cursor: pointer;
    }
    .tab.on { color: var(--green); border-bottom-color: var(--green-strong); }

    .body { flex: 1; padding: 0.95rem 0.95rem 1.5rem; }

    /* Hole card */
    .hole-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem 1rem 1rem;
      box-shadow: var(--shadow);
      margin-bottom: 0.85rem;
    }
    .hole-nav {
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 0.4rem;
    }
    .hole-arrow {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--card);
      color: var(--ink);
      display: grid; place-items: center;
      font-size: 1.4rem; cursor: pointer;
    }
    .hole-arrow:disabled { opacity: 0.3; cursor: default; }
    .hole-big { text-align: center; line-height: 1; }
    .hole-big .lbl { font: 700 0.68rem/1 system-ui, sans-serif; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
    .hole-big .num { font: 400 3rem/1 Georgia, serif; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
    .hole-meta { text-align: center; margin-top: 0.45rem; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

    /* Dots strip */
    .dots-wrap { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px dashed var(--line); }
    .dots { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.25rem; }
    .dots-lap { display: flex; align-items: baseline; margin: 0.55rem 0 0.3rem; }
    .dots-lap--back { margin-top: 0.7rem; }
    .dots-lap__lbl { font: 700 0.62rem/1 system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .dot {
      text-align: center;
      padding: 0.3rem 0;
      border-radius: 6px;
      cursor: pointer; border: none; background: transparent;
      font: 600 0.62rem/1 system-ui, sans-serif;
      color: var(--muted);
    }
    .dot .n { display: block; font-size: 0.6rem; color: var(--muted); margin-bottom: 0.2rem; }
    .dot .v { display: block; font: 500 0.95rem/1 Georgia, serif; color: var(--ink); font-variant-numeric: tabular-nums; }
    .dot.done { background: var(--green-soft); }
    .dot.done .v { color: var(--green); }
    .dot.now { background: var(--brass-soft); }
    .dot.now .v { color: var(--brass); }
    .dot.empty .v { color: var(--muted); opacity: 0.4; }

    /* Team score row */
    .team {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1rem 1.15rem;
      box-shadow: var(--shadow);
      margin-bottom: 0.7rem;
    }
    .team-hd {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 0.5rem; margin-bottom: 0.7rem;
    }
    .team-nm { font: 600 0.98rem/1.15 system-ui, sans-serif; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .team-nm small { display: block; font: 400 0.72rem/1.3 system-ui, sans-serif; color: var(--muted); margin-top: 0.15rem; }
    .team-row {
      display: grid; grid-template-columns: 56px 1fr 56px;
      align-items: center; gap: 0.7rem;
    }
    .sc-btn {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--card);
      color: var(--ink); cursor: pointer;
      font: 500 1.9rem/1 system-ui, sans-serif;
      display: grid; place-items: center;
      touch-action: manipulation;
    }
    .sc-btn:active { transform: scale(0.94); }
    .sc-num {
      text-align: center;
      font: 400 3rem/1 Georgia, serif;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .sc-num.empty { color: var(--muted); opacity: 0.3; }
    .sc-label {
      text-align: center; margin-top: 0.3rem;
      font: 700 0.7rem/1 system-ui, sans-serif;
      letter-spacing: 0.14em; text-transform: uppercase;
      min-height: 0.8rem;
    }
    .sc-label.par { color: var(--muted); }
    .sc-label.birdie, .sc-label.eagle { color: var(--green); }
    .sc-label.bogey { color: var(--brass); }
    .sc-label.dbl, .sc-label.trip { color: var(--danger); }

    /* Totals */
    .totals {
      display: flex; gap: 0.6rem;
      padding: 0.75rem 0.85rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--green-strong);
      border-radius: 10px;
      margin-top: 0.5rem;
    }
    .tot { flex: 1; text-align: center; }
    .tot .k { font: 700 0.62rem/1 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .tot .v { font: 500 1.2rem/1 Georgia, serif; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 0.28rem; display: block; }
    .tot.pos .v { color: var(--brass); }
    .tot.neg .v { color: var(--green); }

    /* Leaderboard */
    .lb-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 0.15rem 0.15rem 0.6rem; gap: 0.5rem;
    }
    .lb-flight { font: 500 1.1rem/1.15 Georgia, serif; color: var(--ink); }
    .lb-flight small { display: block; font: 400 0.72rem/1.3 system-ui, sans-serif; color: var(--muted); }
    .lb-seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
    .lb-seg button {
      border: none; background: transparent;
      padding: 0.32rem 0.6rem;
      font: 600 0.75rem/1 system-ui, sans-serif;
      color: var(--muted);
      border-radius: 999px;
      cursor: pointer;
    }
    .lb-seg button.on { background: var(--green-strong); color: var(--paper); }
    .lb-list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .lb-row {
      display: grid; grid-template-columns: 28px 1fr auto auto;
      gap: 0.65rem; align-items: center;
      padding: 0.7rem 0.8rem;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .lb-row:first-child { border-top: none; }
    .lb-row.you { background: var(--you); }
    .lb-pos { font: 600 0.9rem/1 Georgia, serif; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
    .lb-row.top .lb-pos { color: var(--brass); }
    .lb-name { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-name small { display: block; font: 400 0.72rem/1.3 system-ui, sans-serif; color: var(--muted); margin-top: 0.15rem; overflow: hidden; text-overflow: ellipsis; }
    .lb-score {
      font: 500 1.05rem/1 Georgia, serif;
      font-variant-numeric: tabular-nums;
      min-width: 2.6rem; text-align: right;
      color: var(--ink);
    }
    .lb-score.under { color: var(--green); }
    .lb-score.over { color: var(--brass); }
    .lb-thru { font: 600 0.7rem/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .lb-empty { padding: 1.4rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; }

    .footer-tip { margin-top: 1.2rem; padding: 0.75rem 0.9rem; background: var(--paper-2); border: 1px dashed var(--line); border-radius: 10px; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

    /* Marker scoring — banner above the hole card telling the captain
       whose card they're scoring (marker mode) or that someone else
       has the pencil (spectator mode). Brass accent so it reads as
       tournament-context, not chrome. */
    .mkr-hdr { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.75rem 0.9rem; margin-bottom: 0.75rem; background: var(--brass-soft); border: 1px solid var(--brass); border-left: 4px solid var(--brass); border-radius: 10px; color: var(--ink); }
    .mkr-hdr small { font: 700 0.7rem/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
    .mkr-hdr b { font: 700 1.1rem/1.2 system-ui, sans-serif; color: var(--brass); }
    .mkr-hdr--spec { flex-direction: row; align-items: center; background: var(--paper-2); border-color: var(--line); color: var(--muted); font: 600 0.88rem/1.35 system-ui, sans-serif; }
    .mkr-hdr--spec b { color: var(--ink); font-size: inherit; margin-right: 0.3rem; }

    /* Card-switcher tabs (group scorer only) — small pills across the
       top of the scorecard, one per tee-mate. Active card gets the
       green pill; others are neutral. Wraps if 3 teams don't fit. */
    .mkr-cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.4rem; margin-bottom: 0.8rem; }
    .mkr-card { display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem; padding: 0.55rem 0.75rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; text-align: left; min-height: 0; }
    .mkr-card small { font: 700 0.62rem/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
    .mkr-card span { font: 700 0.9rem/1.15 system-ui, sans-serif; word-break: break-word; }
    .mkr-card em { font-style: normal; font-weight: 500; color: var(--muted); }
    .mkr-card.on { background: var(--green-strong); border-color: var(--green-strong); color: var(--paper); }
    .mkr-card.on small { color: rgba(255,255,255,0.75); }
    .mkr-card.on em { color: rgba(255,255,255,0.8); }

    /* Locked team score (spectator) — visually dims the +/– area so
       the captain sees a live-updating number rather than blank space
       where the buttons used to be. */
    .team--locked .team-row { justify-content: center; opacity: 0.85; }

    /* "Your team" read-only summary below the active card in marker /
       group-scorer modes. Compact three-number strip: Thru / Gross /
       To par — same shape as the main totals but muted and dimmer to
       signal "this is a mirror, not editable here". */
    .mkr-mine { margin-top: 0.85rem; padding: 0.7rem 0.9rem; background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; }
    .mkr-mine__hd { font: 700 0.72rem/1 system-ui, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .mkr-mine__body { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    .mkr-mine__tot { display: flex; flex-direction: column; align-items: flex-start; }
    .mkr-mine__tot .k { font: 700 0.62rem/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .mkr-mine__tot .v { font: 500 1.1rem/1 Georgia, serif; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 0.15rem; }
    .mkr-mine__tot.pos .v { color: var(--brass); }
    .mkr-mine__tot.neg .v { color: var(--green); }
    .mkr-mine__chip { display: block; width: 100%; margin-top: 0.7rem; padding: 0.6rem 0.75rem; border-radius: 10px; font: 700 0.85rem/1.2 system-ui, sans-serif; text-align: center; cursor: default; border: 1px solid var(--line); background: transparent; color: var(--ink); }
    .mkr-mine__chip--btn { background: var(--green-strong); border-color: var(--green-strong); color: var(--paper); cursor: pointer; }
    .mkr-mine__chip--btn:active { transform: translateY(1px); }
    .mkr-mine__chip--done { background: var(--green-soft); border-color: var(--green-soft); color: var(--green); font-weight: 600; }

    /* End-of-round attest panel — brass-outlined block below the totals
       row. Two signature lines (Marker / Team); each shows a green check
       + name + time once signed, a button when the current captain has
       authority to sign, or a muted "waiting on ..." placeholder. Both
       signed → panel fades to green to signal the card is closed. */
    .atst { margin-top: 0.9rem; padding: 0.85rem 0.95rem 0.9rem; background: var(--brass-soft); border: 1px solid var(--brass); border-left: 4px solid var(--brass); border-radius: 12px; }
    .atst--done { background: var(--green-soft); border-color: var(--green-strong); border-left-color: var(--green-strong); }
    .atst-hd { font: 700 0.72rem/1 system-ui, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    .atst--done .atst-hd { color: var(--green); }
    .atst-line { display: grid; grid-template-columns: 4rem 1fr auto; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-top: 1px dashed var(--line); }
    .atst-line:first-of-type { border-top: none; padding-top: 0; }
    .atst-role { font: 700 0.72rem/1 system-ui, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
    .atst-name { font: 700 0.95rem/1.2 system-ui, sans-serif; color: var(--green); }
    .atst-name--wait { font-weight: 500; color: var(--muted); }
    .atst-when { font: 500 0.75rem/1 system-ui, sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; }
    .atst-btn { padding: 0.5rem 0.85rem; border-radius: 8px; border: 0; background: var(--green-strong); color: var(--paper); font: 700 0.85rem/1 system-ui, sans-serif; cursor: pointer; grid-column: 2 / -1; justify-self: end; }
    .atst-btn:active { transform: translateY(1px); }

    /* Extras (mulligans, string, etc.) — one row per configured extra
       your team bought at check-in. Remaining count shows as stars; tap
       "Use one" to burn one. Once used, the star disappears here AND on
       the leaderboard so nobody can quietly claim more than they paid
       for. The card only renders extras where remaining > 0 so a
       cleaned-out row falls off the screen. */
    .extras-card { margin-top: 0.85rem; padding: 0.85rem 0.9rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    .extras-card__hd { font: 700 0.75rem/1 system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .extras-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px dashed var(--line); }
    .extras-row:first-of-type { border-top: none; padding-top: 0; }
    /* Placeholder row for extras the team didn't buy — dimmed so the
       captain sees the mechanic exists without confusing it with a
       purchased-and-remaining row. */
    .extras-row--none { opacity: 0.55; }
    .extras-row--none .extras-row__nm { font-weight: 600; color: var(--muted); }
    .extras-row__nm { font: 700 0.95rem/1.1 system-ui, sans-serif; color: var(--ink); min-width: 5rem; }
    .extras-row__stars { flex: 1; display: flex; align-items: center; gap: 0.15rem; flex-wrap: wrap; color: var(--brass); font-size: 1.05rem; letter-spacing: 0.1em; }
    .extras-row__stars--none { color: var(--muted); font: 600 0.78rem/1 system-ui, sans-serif; letter-spacing: 0.06em; opacity: 0.7; }
    .extras-row__use { padding: 0.5rem 0.85rem; font: 700 0.85rem/1 system-ui, sans-serif; color: var(--paper); background: var(--green-strong); border: 0; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .extras-row__use:disabled { background: var(--paper-2); color: var(--muted); cursor: not-allowed; }
    .extras-row__use.is-saving { opacity: 0.6; }

    /* Leaderboard star strip — small brass stars sit next to team names
       so anyone glancing at the leaderboard can see who has unused
       mulligans / string / etc. remaining. Small size + tight spacing
       so the row height stays the same. */
    .lb-extras { display: inline-flex; align-items: center; gap: 0.35rem; margin-left: 0.35rem; vertical-align: middle; }
    .lb-extras__type { display: inline-flex; align-items: center; gap: 0.1rem; padding: 0.05rem 0.35rem; border: 1px solid var(--brass); border-radius: 6px; color: var(--brass); font: 700 0.62rem/1 system-ui, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
    .lb-extras__type b { font-weight: 700; margin-right: 0.15rem; }
    .lb-extras__stars { font-size: 0.75rem; letter-spacing: 0.04em; line-height: 1; }

    /* Loading / error states */
    .fill { flex: 1; display: grid; place-items: center; padding: 2rem 1.5rem; text-align: center; }
    .fill h2 { font: 400 1.35rem/1.2 Georgia, serif; color: var(--ink); margin: 0 0 0.5rem; }
    .fill p { color: var(--muted); margin: 0; max-width: 30ch; }

    /* Day switcher (only when 2-round tournament) */
    .day-switch { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
    .day-btn {
      flex: 1;
      padding: 0.55rem 0.5rem;
      font: 600 0.85rem/1 system-ui, sans-serif;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }
    .day-btn.on { background: var(--green-strong); color: var(--paper); border-color: var(--green-strong); }

    :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="fill" id="loading">
      <div>
        <h2>Loading your scorecard…</h2>
        <p>One moment.</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      "use strict";
      var q = new URLSearchParams(location.search);
      var TOKEN = q.get("t") || "";
      var app = document.getElementById("app");

      // F&H is a 9-hole course. Most tournaments play those 9 holes TWICE
      // for an 18-hole round; a rare 9-hole event just plays once. Pars are
      // the physical 9-hole par set — the back nine reuses the same values.
      var PARS9 = [4, 3, 4, 4, 5, 4, 4, 3, 5];
      var HOLES_TOTAL = 18; // default per round; could be Format-driven later
      function parAtIndex(idx) { return PARS9[idx % 9] || 4; }
      function physicalHole(idx) { return (idx % 9) + 1; }
      function lapOf(idx) { return Math.floor(idx / 9) + 1; }

      var STATE = {
        team: null,       // { id, teamName, partners, hole, ... } — captain's OWN team
        tournament: "",
        config: {},
        field: [],
        day: 1,           // 1 or 2 (rounds — Founders is 2)
        holeIdx: 0,       // 0..17 — storage index of the hole currently displayed
        scores: { 1: [], 2: [] },  // scores for the ACTIVE card (may be own team or a marker target)
        tab: "score",     // "score" | "lb"
        lbFilter: "mine", // "mine" | "all"
        saveTimer: null,
        savingCount: 0,
        // Marker scoring state — set from server response on load().
        // marker[day].mode ∈ {self, marker, group_scorer, spectator}.
        // writeTargets = signup ids the captain's token can score.
        // teeMates = full pairing group for display.
        marker: { d1: null, d2: null },
        activeCardId: null,  // signup id currently being scored (from writeTargets)
      };

      // Shotgun play order for one lap starting from H: [H, H+1, …, 9, 1, …, H-1].
      // playOrderIndices(startHole) returns storage indices in the order the
      // captain actually plays them across both laps of an 18-hole round.
      // Example (startHole=2): first lap = holes 2..9,1 → indices 1..8,0; second
      // lap plays the same 9 again → indices 10..17,9. So the captain hits
      // "Next" 17 times to walk their whole day.
      function playOrder(startHole) {
        var start = (Number(startHole) >= 1 && Number(startHole) <= 9) ? Number(startHole) : 1;
        var out = [];
        for (var i = 0; i < 9; i++) out.push(((start - 1 + i) % 9) + 1);
        return out;
      }
      function playOrderIndices(startHole) {
        var laps = HOLES_TOTAL >= 18 ? 2 : 1;
        var lapHoles = playOrder(startHole);
        var out = [];
        for (var lap = 0; lap < laps; lap++) {
          for (var i = 0; i < lapHoles.length; i++) out.push((lap * 9) + (lapHoles[i] - 1));
        }
        return out;
      }
      function teamStartHole() {
        // Start hole comes from the ACTIVE card's pairing for the
        // current day. Different teams can start on different holes;
        // a marker's screen should navigate the marker-target's course
        // order, not their own. Falls back to hole 1 if unset.
        var a = _active();
        var holeKey = STATE.day === 2 ? "d2Hole" : "hole";
        var h = a ? Number(a[holeKey]) : NaN;
        if (!(h >= 1 && h <= 9)) {
          // Own team's start as a secondary fallback.
          h = STATE.team ? Number(STATE.team.hole) : NaN;
        }
        return (h >= 1 && h <= 9) ? h : 1;
      }

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      function showError(msg) {
        app.innerHTML = '<div class="fill"><div><h2>' + esc(msg) + '</h2><p>Ask the pro shop for a fresh link — they can text a new one from the Check-In tab.</p></div></div>';
      }

      function load() {
        if (!TOKEN) { showError("This page needs a scoring link."); return; }
        fetch(FH_API.url("/api/tournament-signups?live=" + encodeURIComponent(TOKEN)), { cache: "no-store" })
          .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Bad response." }; }); })
          .then(function (j) {
            if (!j || !j.ok) { showError((j && j.error) || "Couldn't load your scorecard."); return; }
            STATE.team = j.team;
            STATE.tournament = j.tournament || "";
            STATE.config = j.config || {};
            STATE.field = j.field || [];
            // Marker assignment (server-computed). Falls back to a
            // self-mode baseline if the response predates PR #321.
            STATE.marker = (j.markerAssignment && j.markerAssignment.d1)
              ? j.markerAssignment
              : { d1: { mode: "self", writeTargets: [j.team.id], marking: null, teeMates: [], groupScorerName: null },
                  d2: { mode: "self", writeTargets: [j.team.id], marking: null, teeMates: [], groupScorerName: null } };
            // If day 1 is done and day 2 has room, jump to day 2.
            if (isDayFull(1) && !isDayFull(2) && (STATE.config.rounds || 1) >= 2) STATE.day = 2;
            // Pick the initial active card = first writable target for the
            // current day. Spectator falls back to captain's own team so
            // they see their scorecard read-only rather than nothing.
            _syncActiveCardForDay();
            // Land on the first blank hole IN SHOTGUN ORDER of the active
            // card so a captain starting on hole 5 opens straight to hole 5.
            STATE.holeIdx = firstBlankInPlayOrder(STATE.day);
            render();
          })
          .catch(function () { showError("Network error loading your scorecard."); });
      }

      // Marker helpers — read the current-day assignment + which card
      // is being scored. `_active()` returns the field row for the card
      // being scored (may be the captain's own or a marker target).
      function _dayKey() { return STATE.day === 2 ? "d2" : "d1"; }
      function _dayAssignment() { return (STATE.marker && STATE.marker[_dayKey()]) || null; }
      function _findTeam(id) {
        if (!id) return null;
        if (STATE.team && STATE.team.id === id) return STATE.team;
        for (var i = 0; i < STATE.field.length; i++) if (STATE.field[i].id === id) return STATE.field[i];
        return null;
      }
      function _active() {
        return _findTeam(STATE.activeCardId) || STATE.team;
      }
      // After a day switch (or a fresh load) re-select which card the
      // captain is scoring. Also reloads STATE.scores from that card's
      // stored Day1/Day2 scores so +/- edits target the right team.
      function _syncActiveCardForDay() {
        var a = _dayAssignment();
        var targets = (a && Array.isArray(a.writeTargets)) ? a.writeTargets : [];
        // Pick the current activeCardId only if it's still a valid target
        // for this day; otherwise reset to first target. Spectator (no
        // targets) falls back to captain's own team for read-only display.
        var pick = (STATE.activeCardId && targets.indexOf(STATE.activeCardId) !== -1)
          ? STATE.activeCardId
          : (targets[0] || (STATE.team && STATE.team.id) || null);
        STATE.activeCardId = pick;
        var active = _findTeam(pick);
        if (active) {
          STATE.scores[1] = parseScores(active.day1);
          STATE.scores[2] = parseScores(active.day2);
        }
      }

      // Configured extras from the tournament (Format tab → Extras
      // JSON) that are TRACKABLE — i.e. the captain can tap "Use one"
      // mid-round. Physical extras like String (track:false) don't
      // render a button and don't show up on the leaderboard stars —
      // there's no way to know from the phone when someone uses them,
      // so pretending we can track them would be misleading.
      function configExtras() {
        var raw = (STATE.config && STATE.config.extras) || "";
        if (!raw) return [];
        try {
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          return arr.map(function (e) { return {
            name: String((e && e.name) || "").trim(),
            price: Number(e && e.price) || 0,
            track: (e && e.track === false) ? false : true,
          }; })
                    .filter(function (e) { return e.name && e.track; });
        } catch (err) { return []; }
      }
      // Team's per-player extras purchases from Check-In:
      //   {"Mulligans":["p1","p3"],"String":["p2"]}
      // Returns a plain count-per-name map (["p1","p3"] → 2).
      function purchasedCounts(raw) {
        var out = {};
        try {
          var obj = JSON.parse(raw || "{}");
          if (!obj || typeof obj !== "object" || Array.isArray(obj)) return out;
          Object.keys(obj).forEach(function (k) {
            if (Array.isArray(obj[k])) out[k] = obj[k].filter(function (s) { return /^p[1-4]$/.test(s); }).length;
          });
        } catch (e) {}
        return out;
      }
      // Team-wide count of already-used extras — the captain increments
      // this from their phone. Same shape read/write path so the number
      // never drifts across screens.
      function usedCounts(raw) {
        var out = {};
        try {
          var obj = JSON.parse(raw || "{}");
          if (!obj || typeof obj !== "object" || Array.isArray(obj)) return out;
          Object.keys(obj).forEach(function (k) {
            var n = Number(obj[k]);
            if (isFinite(n) && n > 0) out[k] = Math.floor(n);
          });
        } catch (e) {}
        return out;
      }
      // Purchased minus used for a given team + extra name. Never negative.
      function remainingFor(purchasedRaw, usedRaw, name) {
        var p = purchasedCounts(purchasedRaw)[name] || 0;
        var u = usedCounts(usedRaw)[name] || 0;
        return Math.max(0, p - u);
      }

      function parseScores(raw) {
        try {
          var arr = JSON.parse(raw || "[]");
          if (!Array.isArray(arr)) return new Array(HOLES_TOTAL).fill(null);
          var out = new Array(HOLES_TOTAL).fill(null);
          for (var i = 0; i < HOLES_TOTAL; i++) {
            var n = Math.round(Number(arr[i]));
            out[i] = (isFinite(n) && n >= 1 && n <= 40) ? n : null;
          }
          return out;
        } catch (e) { return new Array(HOLES_TOTAL).fill(null); }
      }
      function isDayFull(d) {
        var s = STATE.scores[d] || [];
        for (var i = 0; i < HOLES_TOTAL; i++) if (s[i] == null) return false;
        return true;
      }
      // First unentered hole in shotgun play order — used to land the captain
      // on their next hole after a mid-round refresh (front OR back nine).
      function firstBlankInPlayOrder(d) {
        var s = STATE.scores[d] || [];
        var order = playOrderIndices(teamStartHole());
        for (var i = 0; i < order.length; i++) {
          if (s[order[i]] == null) return order[i];
        }
        return order[order.length - 1];
      }
      // Advance/retreat in shotgun order. Walks the full 18-hole play sequence
      // (front nine, then back nine at the same shotgun start).
      function stepHole(dir) {
        var order = playOrderIndices(teamStartHole());
        var idx = order.indexOf(STATE.holeIdx);
        if (idx < 0) idx = 0;
        var next = idx + dir;
        if (next < 0 || next >= order.length) return;
        STATE.holeIdx = order[next];
      }
      function holeStepIndex() {
        var order = playOrderIndices(teamStartHole());
        var idx = order.indexOf(STATE.holeIdx);
        return idx < 0 ? 0 : idx;
      }
      function currentPar() { return parAtIndex(STATE.holeIdx); }
      function currentScore() { return STATE.scores[STATE.day][STATE.holeIdx]; }
      function grossThru(d) {
        var s = STATE.scores[d] || [], t = 0, has = 0;
        for (var i = 0; i < HOLES_TOTAL; i++) if (s[i] != null) { t += s[i]; has++; }
        return { total: t, holes: has };
      }
      // To-par against the holes ACTUALLY PLAYED (in shotgun order) — a
      // captain 4-holes in should see their to-par against the pars of those
      // specific 4 holes, not "the first 4 pars on the card".
      function pplThru(d) {
        var s = STATE.scores[d] || [];
        var order = playOrderIndices(teamStartHole());
        var gross = 0, parSoFar = 0, holes = 0;
        for (var i = 0; i < order.length; i++) {
          var idx = order[i];
          if (s[idx] != null) { gross += s[idx]; parSoFar += parAtIndex(idx); holes++; }
        }
        return holes ? (gross - parSoFar) : 0;
      }
      function labelForScore(v, par) {
        if (v == null) return "";
        var d = v - par;
        if (v === 1) return "Ace";
        if (d <= -2) return "Eagle";
        if (d === -1) return "Birdie";
        if (d === 0) return "Par";
        if (d === 1) return "Bogey";
        if (d === 2) return "Double";
        if (d >= 3) return d + " over";
        return "";
      }
      function labelClass(v, par) {
        if (v == null) return "";
        var d = v - par;
        if (d < 0) return "birdie";
        if (d === 0) return "par";
        if (d === 1) return "bogey";
        return "dbl";
      }
      function formatToPar(n) {
        if (n === 0) return "E";
        return n > 0 ? "+" + n : String(n);
      }

      function render() {
        var t = STATE.team;
        var tourn = STATE.config.name || STATE.tournament || "F&H Tournament";
        var partners = (t.partners || "").split(/\s*\/\s*/).filter(Boolean);
        var names = [t.teamName].concat(partners).filter(Boolean).join(" · ");
        var multiDay = (STATE.config.rounds || 1) >= 2;

        var html = ""
          + '<header class="app-hd">'
          +   '<img class="app-logo" src="images/logo.png" alt="F&amp;H" />'
          +   '<div class="app-title">'
          +     '<div class="t">' + esc(tourn) + '</div>'
          +     '<div class="sub">' + esc(names || "Your team") + '</div>'
          +   '</div>'
          +   '<span class="live" id="liveDot" title="Live-syncing to the leaderboard">Live</span>'
          + '</header>'
          + '<div class="tabs" role="tablist">'
          +   '<button class="tab ' + (STATE.tab === "score" ? "on" : "") + '" type="button" data-tab="score">Scorecard</button>'
          +   '<button class="tab ' + (STATE.tab === "lb" ? "on" : "") + '" type="button" data-tab="lb">Leaderboard</button>'
          + '</div>'
          + '<main class="body">'
          + (STATE.tab === "score" ? renderScorecard(multiDay) : renderLeaderboard())
          + '</main>';
        app.innerHTML = html;
        wire();
      }

      function renderScorecard(multiDay) {
        var scores = STATE.scores[STATE.day];
        var par = currentPar();
        var cur = currentScore();
        var g = grossThru(STATE.day);
        var toPar = pplThru(STATE.day);
        var order = playOrderIndices(teamStartHole());
        var stepIdx = holeStepIndex();
        // Dots walk shotgun play order across both laps. First 9 = front,
        // next 9 = back (same physical holes played a second time). Two
        // rows so the strip stays finger-friendly on a phone.
        function renderDotRow(sliceStart, sliceEnd) {
          var out = "";
          for (var i = sliceStart; i < sliceEnd; i++) {
            var idx = order[i];
            var holeN = physicalHole(idx);
            var cls = "empty";
            if (scores[idx] != null) cls = (idx === STATE.holeIdx) ? "now" : "done";
            else if (idx === STATE.holeIdx) cls = "now";
            out += '<button type="button" class="dot ' + cls + '" data-jumpidx="' + idx + '"><span class="n">' + holeN + '</span><span class="v">' + (scores[idx] == null ? "–" : scores[idx]) + '</span></button>';
          }
          return out;
        }
        var lapCount = HOLES_TOTAL >= 18 ? 2 : 1;
        var dotsHtml = '<div class="dots">' + renderDotRow(0, 9) + '</div>';
        if (lapCount === 2) {
          dotsHtml = '<div class="dots-lap"><span class="dots-lap__lbl">Front 9</span></div>'
            + '<div class="dots">' + renderDotRow(0, 9) + '</div>'
            + '<div class="dots-lap dots-lap--back"><span class="dots-lap__lbl">Back 9</span></div>'
            + '<div class="dots">' + renderDotRow(9, 18) + '</div>';
        }
        var lbl = labelForScore(cur, par);
        var lblCls = labelClass(cur, par);
        var startHole = teamStartHole();
        var lap = lapOf(STATE.holeIdx);
        var lapBadge = (lapCount === 2 && lap === 2) ? ' &middot; 2nd time around' : '';
        // Marker context for this render — which team is currently the
        // ACTIVE (scored) card, mode banner text, spectator lockout.
        var assign = _dayAssignment() || { mode: "self" };
        var active = _active();
        var activeName = (active && active.teamName) || "Team";
        var isSpectator = assign.mode === "spectator";
        var isSelfScore = assign.mode === "self";
        var startBadge = (active && active.hole)
          ? ('Started on Hole ' + startHole + (active.start ? (' · ' + esc(active.start)) : ''))
          : 'No tee assigned yet';
        // Big-and-obvious "who am I scoring right now" banner — captain
        // name in caps so the operator can't accidentally tap the wrong
        // team's +/-. Only shown when marker scoring flips this out of
        // the simple self-score case; Founders self-score round looks
        // the same as before.
        var scoringWho = '';
        if (!isSelfScore) {
          if (assign.mode === "marker") {
            scoringWho = '<div class="mkr-hdr"><small>You are marking</small><b>' + esc(activeName) + "'s team</b></div>";
          } else if (assign.mode === "group_scorer") {
            scoringWho = '<div class="mkr-hdr"><small>Scoring for</small><b>' + esc(activeName) + "'s team</b></div>";
          } else if (isSpectator) {
            scoringWho = '<div class="mkr-hdr mkr-hdr--spec"><b>' + esc(assign.groupScorerName || "Someone") + '</b> is scoring your group. Everyone sees the same card live &mdash; no taps needed here.</div>';
          }
        }
        return ''
          + (multiDay ? renderDaySwitch() : "")
          + scoringWho
          + renderCardSwitcher(assign)
          + '<div class="hole-card">'
          +   '<div class="hole-nav">'
          +     '<button class="hole-arrow" type="button" id="prevHole"' + (stepIdx === 0 ? " disabled" : "") + ' aria-label="Previous hole">&lsaquo;</button>'
          +     '<div class="hole-big"><div class="lbl">Hole</div><div class="num">' + physicalHole(STATE.holeIdx) + '</div></div>'
          +     '<button class="hole-arrow" type="button" id="nextHole"' + (stepIdx === order.length - 1 ? " disabled" : "") + ' aria-label="Next hole">&rsaquo;</button>'
          +   '</div>'
          +   '<div class="hole-meta">Par ' + par + lapBadge + ' &middot; ' + startBadge + '</div>'
          +   '<div class="dots-wrap">' + dotsHtml + '</div>'
          + '</div>'
          + '<div class="team' + (isSpectator ? ' team--locked' : '') + '">'
          +   '<div class="team-hd">'
          +     '<div class="team-nm">' + (isSelfScore ? 'Team score' : esc(activeName)) + '<small>' + (isSpectator ? 'Read-only — updates live' : 'Tap +/– for this hole') + '</small></div>'
          +   '</div>'
          +   '<div class="team-row">'
          +     (isSpectator ? '' : '<button class="sc-btn" type="button" id="scDown" aria-label="Decrease score">&minus;</button>')
          +     '<div><div class="sc-num' + (cur == null ? " empty" : "") + '">' + (cur == null ? "–" : cur) + '</div><div class="sc-label ' + lblCls + '">' + lbl + '</div></div>'
          +     (isSpectator ? '' : '<button class="sc-btn" type="button" id="scUp" aria-label="Increase score">+</button>')
          +   '</div>'
          + '</div>'
          + '<div class="totals">'
          +   '<div class="tot"><span class="k">Thru</span><span class="v">' + g.holes + '</span></div>'
          +   '<div class="tot"><span class="k">Gross</span><span class="v">' + (g.holes ? g.total : "–") + '</span></div>'
          +   '<div class="tot ' + (toPar > 0 ? "pos" : toPar < 0 ? "neg" : "") + '"><span class="k">To par</span><span class="v">' + (g.holes ? formatToPar(toPar) : "–") + '</span></div>'
          + '</div>'
          + renderAttestPanel(assign)
          + renderOwnTeamReadOnly(assign)
          + renderExtrasCard()
          + '<p class="footer-tip">Scores auto-save as you tap. A green dot means saved; a brass one means saving. If cell signal drops mid-round, your scores queue and post as soon as it&rsquo;s back.</p>';
      }

      // Signature line — pretty-prints the "Kyle McConnell • 2026-08-17T18:30:00Z"
      // shape the server writes onto Airtable. Empty string returns null so the
      // caller can decide whether to show "not signed yet" text.
      function _fmtAttest(raw) {
        if (!raw) return null;
        var parts = String(raw).split("•");
        var name = (parts[0] || "").trim() || "Someone";
        var when = (parts[1] || "").trim();
        var pretty = when;
        try {
          var d = new Date(when);
          if (!isNaN(d.getTime())) {
            var h = d.getHours(), m = d.getMinutes();
            var mer = h >= 12 ? "PM" : "AM";
            var h12 = ((h + 11) % 12) + 1;
            pretty = h12 + ":" + (m < 10 ? "0" + m : m) + " " + mer;
          }
        } catch (e) {}
        return { name: name, when: pretty };
      }
      // End-of-round attest panel — appears once the active card has all 18
      // holes filled. Two signature lines: Marker (scorer) + Team (scored).
      // Buttons render only for the signatures THIS captain is authorized
      // to give. Founders (self-score) sees both buttons for their own team;
      // marker-mode captains see only marker for the card they mark; group
      // scorers see marker for every card they score. Team sig only shows
      // when the active card IS the captain's own team.
      function renderAttestPanel(assign) {
        if (!assign) return "";
        var active = _active(); if (!active) return "";
        var isDay2 = STATE.day === 2;
        var scoresRaw = parseScores(isDay2 ? active.day2 : active.day1);
        var full = scoresRaw.length >= 18 && scoresRaw.slice(0, 18).every(function (n) { return n != null; });
        var markerRaw = isDay2 ? active.d2AttestMarker : active.d1AttestMarker;
        var teamRaw   = isDay2 ? active.d2AttestTeam   : active.d1AttestTeam;
        var canWriteThis = Array.isArray(assign.writeTargets) && assign.writeTargets.indexOf(active.id) !== -1;
        var isOwnTeam = STATE.team && active.id === STATE.team.id;
        var wantMarkerBtn = full && canWriteThis && !markerRaw;
        var wantTeamBtn   = full && isOwnTeam && !teamRaw;
        // Hide the panel entirely when nothing to show — the card isn't full
        // yet AND nothing's been signed. Once anything is signed we keep the
        // panel visible so the captain sees the sig even mid-round (rare
        // pre-attest edge, but avoids the panel popping in and out).
        if (!full && !markerRaw && !teamRaw) return "";
        var markerSig = _fmtAttest(markerRaw);
        var teamSig   = _fmtAttest(teamRaw);
        function line(role, sig, wantBtn, actionKey) {
          if (sig) return '<div class="atst-line atst-line--done"><span class="atst-role">' + role + '</span><span class="atst-name">&#10003; ' + esc(sig.name) + '</span><span class="atst-when">' + esc(sig.when) + '</span></div>';
          if (wantBtn) return '<div class="atst-line"><span class="atst-role">' + role + '</span><button type="button" class="atst-btn" data-attest="' + actionKey + '">Sign as ' + role.toLowerCase() + '</button></div>';
          return '<div class="atst-line atst-line--wait"><span class="atst-role">' + role + '</span><span class="atst-name atst-name--wait">' + (full ? 'Waiting on ' + (role === "Marker" ? "the scorer" : "the team") : 'Finish the round first') + '</span></div>';
        }
        var allDone = markerSig && teamSig;
        return '<div class="atst' + (allDone ? " atst--done" : "") + '">'
          + '<div class="atst-hd">' + (allDone ? "Card attested" : "End-of-round attestation") + '</div>'
          + line("Marker", markerSig, wantMarkerBtn, "marker")
          + line("Team",   teamSig,   wantTeamBtn,   "team")
          + '</div>';
      }

      // Tap-to-switch card row (group scorer only). Small tabs across
      // the top of the scorecard, one per tee-mate — active card is
      // highlighted, others are tappable. Marker + spectator + self
      // don't get a picker (their editable/read-only set is fixed).
      function renderCardSwitcher(assign) {
        if (!assign || assign.mode !== "group_scorer") return "";
        var mates = Array.isArray(assign.teeMates) ? assign.teeMates : [];
        if (mates.length <= 1) return "";
        return '<div class="mkr-cards" role="tablist">'
          + mates.map(function (m) {
              var isActive = m.id === STATE.activeCardId;
              var isMe = STATE.team && m.id === STATE.team.id;
              // Two-line pill: "SCORING" (green) or "TAP TO SCORE" (muted)
              // above the captain's name so the operator can't misread which
              // team card they're about to edit. "(you)" tag pinned when it's
              // their own team.
              var badge = isActive ? "SCORING" : "Tap to score";
              return '<button type="button" class="mkr-card' + (isActive ? " on" : "") + '" data-card="' + esc(m.id) + '">'
                + '<small>' + badge + '</small>'
                + '<span>' + esc(m.teamName || "Team") + (isMe ? ' <em>(you)</em>' : '') + '</span>'
                + '</button>';
            }).join("")
          + '</div>';
      }

      // Read-only block for the CAPTAIN'S OWN TEAM — only rendered when
      // the active card is NOT their own team (marker mode). Shows
      // gross + to-par so the captain can see their marker's progress
      // without leaving the tab. Updates via the leaderboard poll cycle.
      function renderOwnTeamReadOnly(assign) {
        if (!STATE.team) return "";
        if (assign && assign.mode === "self") return "";
        if (STATE.activeCardId === STATE.team.id) return ""; // active card IS own team → no extra block
        var s = parseScores(STATE.day === 2 ? STATE.team.day2 : STATE.team.day1);
        var g = 0, holes = 0, parSoFar = 0;
        for (var i = 0; i < s.length; i++) if (s[i] != null) { g += s[i]; parSoFar += parAtIndex(i); holes++; }
        var tp = holes ? (g - parSoFar) : 0;
        // Own-team attest chip — lets the captain accept their team's scores
        // without switching the active card away from whoever they're marking.
        // Same "team" attestation the main panel uses; server always writes
        // it to captainOwnId regardless of the client-sent targetId.
        var full = holes === 18;
        var teamRaw = STATE.day === 2 ? STATE.team.d2AttestTeam : STATE.team.d1AttestTeam;
        var teamSig = _fmtAttest(teamRaw);
        var chip = "";
        if (teamSig) {
          chip = '<div class="mkr-mine__chip mkr-mine__chip--done">&#10003; Attested &middot; ' + esc(teamSig.name) + ' &middot; ' + esc(teamSig.when) + '</div>';
        } else if (full) {
          chip = '<button type="button" class="mkr-mine__chip mkr-mine__chip--btn" data-attest="team-own">Accept your team&rsquo;s scores</button>';
        }
        return '<div class="mkr-mine">'
          +   '<div class="mkr-mine__hd">Your team &middot; ' + esc(STATE.team.teamName || "") + '</div>'
          +   '<div class="mkr-mine__body">'
          +     '<div class="mkr-mine__tot"><span class="k">Thru</span><span class="v">' + holes + '</span></div>'
          +     '<div class="mkr-mine__tot"><span class="k">Gross</span><span class="v">' + (holes ? g : "–") + '</span></div>'
          +     '<div class="mkr-mine__tot ' + (tp > 0 ? "pos" : tp < 0 ? "neg" : "") + '"><span class="k">To par</span><span class="v">' + (holes ? formatToPar(tp) : "–") + '</span></div>'
          +   '</div>'
          +   chip
          + '</div>';
      }

      // Extras card — one row per Format-configured extra your team
      // has any purchases of. Star count = remaining. Tap "Use one"
      // to burn one; row disappears when there are none left. Renders
      // NOTHING when the tournament has no extras or the team bought
      // nothing (no visual clutter for tournaments that don't use extras).
      function renderExtrasCard() {
        var defs = configExtras();
        if (!defs.length) return "";
        var t = STATE.team;
        var pMap = purchasedCounts(t.extrasPurchased);
        var uMap = usedCounts(t.extrasUsed);
        var rows = defs.map(function (d) {
          var bought = pMap[d.name] || 0;
          var used = uMap[d.name] || 0;
          if (!bought) {
            // Not purchased for this team — still show a dim placeholder
            // row so the captain sees the mechanic exists. Reminder to
            // stop by the pro shop if they want in on it.
            return '<div class="extras-row extras-row--none" data-extra="' + esc(d.name) + '">'
              + '<div class="extras-row__nm">' + esc(d.name) + '</div>'
              + '<span class="extras-row__stars extras-row__stars--none">None purchased &mdash; ask the pro shop</span>'
              + '</div>';
          }
          var remain = Math.max(0, bought - used);
          var stars = remain > 0
            ? '<span class="extras-row__stars" title="' + remain + ' left of ' + bought + '">' + repeatStr('&#9679;', remain) + '</span>'
            : '<span class="extras-row__stars extras-row__stars--none">All used</span>';
          return '<div class="extras-row" data-extra="' + esc(d.name) + '">'
            + '<div class="extras-row__nm">' + esc(d.name) + '</div>'
            + stars
            + '<button type="button" class="extras-row__use" data-use-extra="' + esc(d.name) + '"' + (remain <= 0 ? ' disabled' : '') + '>Use one</button>'
            + '</div>';
        }).join("");
        return '<div class="extras-card"><div class="extras-card__hd">Extras</div>' + rows + '</div>';
      }
      function repeatStr(s, n) { var out = ""; for (var i = 0; i < n; i++) out += s; return out; }

      // Small brass-star strip drawn inline next to team names on the
      // Leaderboard. One chip per configured extra with remaining > 0.
      // Uses the extra name's first letter as a label so mixed-type
      // strips (e.g. "M ★★★★  S ★★") stay readable at leaderboard scale.
      // Returns "" for teams with nothing outstanding — no clutter.
      function renderExtrasStars(purchasedRaw, usedRaw) {
        var defs = configExtras();
        if (!defs.length) return "";
        var chips = defs.map(function (d) {
          var remain = remainingFor(purchasedRaw, usedRaw, d.name);
          if (remain <= 0) return "";
          return '<span class="lb-extras__type" title="' + esc(d.name) + ' remaining: ' + remain + '">'
            + '<b>' + esc(d.name.charAt(0).toUpperCase()) + '</b>'
            + '<span class="lb-extras__stars">' + repeatStr('&#9679;', remain) + '</span>'
            + '</span>';
        }).filter(Boolean).join("");
        if (!chips) return "";
        return '<span class="lb-extras" aria-label="Unused extras">' + chips + '</span>';
      }

      // Optimistic increment of the team's Extras Used count for a
      // given extra name. Bumps the in-memory state, re-renders, then
      // POSTs the new JSON. Rolls back the number on server error so
      // the button reflects reality.
      function useExtra(name) {
        var t = STATE.team;
        var uMap = usedCounts(t.extrasUsed);
        var pMap = purchasedCounts(t.extrasPurchased);
        var remain = Math.max(0, (pMap[name] || 0) - (uMap[name] || 0));
        if (remain <= 0) return;
        uMap[name] = (uMap[name] || 0) + 1;
        var newJson = JSON.stringify(uMap);
        var prev = t.extrasUsed;
        t.extrasUsed = newJson;
        // Also update the row in STATE.field so the leaderboard reflects
        // it immediately without waiting on a refetch.
        for (var i = 0; i < STATE.field.length; i++) {
          if (STATE.field[i].id === t.id) { STATE.field[i].extrasUsed = newJson; break; }
        }
        render();
        setLive("saving");
        fetch(FH_API.url("/api/tournament-score"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: TOKEN, extrasUsed: newJson }),
        })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (j) {
            if (!j || !j.ok) throw new Error((j && j.error) || "save failed");
            setLive("saved");
            setTimeout(function () { setLive(""); }, 900);
          })
          .catch(function () {
            // Roll back — put the count back to what the server has.
            t.extrasUsed = prev;
            for (var i = 0; i < STATE.field.length; i++) {
              if (STATE.field[i].id === t.id) { STATE.field[i].extrasUsed = prev; break; }
            }
            setLive("err");
            render();
          });
      }

      function renderDaySwitch() {
        return '<div class="day-switch">'
          + '<button class="day-btn ' + (STATE.day === 1 ? "on" : "") + '" type="button" data-day="1">Day 1</button>'
          + '<button class="day-btn ' + (STATE.day === 2 ? "on" : "") + '" type="button" data-day="2">Day 2</button>'
          + '</div>';
      }

      function renderLeaderboard() {
        // Build team-with-progress rows from the field, then rank by to-par
        // (completed gross first, in-progress ranked by their pace to par).
        var mineFlight = STATE.team.flight;
        var rows = STATE.field.map(function (t) {
          var s = parseScores(t.day1);
          var g = 0, holes = 0, parSoFar = 0;
          for (var i = 0; i < s.length; i++) {
            if (s[i] != null) { g += s[i]; parSoFar += parAtIndex(i); holes++; }
          }
          return { id: t.id, name: t.teamName, partners: t.partners, flight: t.flight, gross: g, holes: holes, toPar: holes ? (g - parSoFar) : null, extrasPurchased: t.extrasPurchased, extrasUsed: t.extrasUsed };
        });
        var showFlight = (STATE.lbFilter === "mine" && mineFlight != null);
        var visible = showFlight
          ? rows.filter(function (r) { return r.flight === mineFlight; })
          : rows;
        // Rank: teams with any score first (ranked by toPar), untouched last.
        visible.sort(function (a, b) {
          if (a.holes && !b.holes) return -1;
          if (!a.holes && b.holes) return 1;
          if (!a.holes && !b.holes) return 0;
          return a.toPar - b.toPar;
        });
        var body = "";
        if (!visible.length) {
          body = '<div class="lb-empty">No scores posted yet. Once teams start entering, they&rsquo;ll show up here.</div>';
        } else {
          body = visible.map(function (r, i) {
            var rank = i + 1;
            var isYou = r.id === STATE.team.id;
            var isTop = rank <= 3;
            var scoreClass = r.holes == null || r.holes === 0 ? "" : (r.toPar < 0 ? "under" : r.toPar > 0 ? "over" : "");
            var scoreText = r.holes ? formatToPar(r.toPar) : "–";
            var thru = r.holes ? ("Thru " + r.holes) : "Not started";
            return '<div class="lb-row ' + (isYou ? "you " : "") + (isTop ? "top" : "") + '">'
              + '<div class="lb-pos">' + rank + '</div>'
              + '<div class="lb-name">' + esc(r.name || "Team") + renderExtrasStars(r.extrasPurchased, r.extrasUsed) + (isYou ? " <small>You · " + esc(r.partners || "") + "</small>" : (r.partners ? "<small>" + esc(r.partners) + "</small>" : "")) + '</div>'
              + '<div class="lb-score ' + scoreClass + '">' + scoreText + '</div>'
              + '<div class="lb-thru">' + thru + '</div>'
              + '</div>';
          }).join("");
        }
        return ''
          + '<div class="lb-head">'
          +   '<div class="lb-flight">' + (showFlight ? ("Flight " + mineFlight) : "Whole field") + '<small>' + (showFlight ? "Your flight" : "All teams") + ' · updated just now</small></div>'
          +   '<div class="lb-seg" role="tablist">'
          +     '<button type="button" data-lb="all" class="' + (STATE.lbFilter === "all" ? "on" : "") + '">All</button>'
          +     '<button type="button" data-lb="mine" class="' + (STATE.lbFilter === "mine" ? "on" : "") + '"' + (mineFlight == null ? " disabled" : "") + '>Mine</button>'
          +   '</div>'
          + '</div>'
          + '<div class="lb-list">' + body + '</div>'
          + '<p class="footer-tip">Ranks by day-one gross so far. Ties split by hole count. The staff-set flight cut on the workbook decides who&rsquo;s in your flight; your position moves as scores come in.</p>';
      }

      function setLive(kind) {
        var el = document.getElementById("liveDot"); if (!el) return;
        el.className = "live" + (kind ? " " + kind : "");
        el.textContent = kind === "saving" ? "Saving" : kind === "saved" ? "Saved" : kind === "err" ? "Retry" : "Live";
      }

      function bumpScore(dir) {
        var i = STATE.holeIdx;
        var cur = STATE.scores[STATE.day][i];
        var par = currentPar();
        var next;
        if (cur == null) next = par;                 // first tap = par
        else next = Math.max(1, Math.min(15, cur + dir));
        STATE.scores[STATE.day][i] = next;
        render();
        queueSave();
      }
      function setScoreFromKeypad(v) {
        var i = STATE.holeIdx;
        STATE.scores[STATE.day][i] = v;
        render();
        queueSave();
      }

      function queueSave() {
        clearTimeout(STATE.saveTimer);
        setLive("saving");
        STATE.saveTimer = setTimeout(saveNow, 350);
      }
      function saveNow() {
        var day = STATE.day;
        // Server expects up to 18. Pad with nulls for holes not yet played
        // (or for a 9-hole event that only fills the front nine).
        var scores = STATE.scores[day].slice();
        while (scores.length < 18) scores.push(null);
        STATE.savingCount++;
        // targetId names WHICH team we're scoring. Server validates it
        // against the captain's writeTargets for this day and 403s if
        // they aren't authorized to mark it (leak-safe token).
        var body = { token: TOKEN, day: day, scores: scores, targetId: STATE.activeCardId };
        fetch(FH_API.url("/api/tournament-score"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (j) {
            STATE.savingCount--;
            if (!j || !j.ok) { setLive("err"); return; }
            setLive("saved");
            // Mirror the write into STATE.field so read-only views (own
            // team block, tee-mate cards for group scorers) reflect the
            // change without waiting on the next poll.
            for (var i = 0; i < STATE.field.length; i++) {
              if (STATE.field[i].id === STATE.activeCardId) {
                var key = day === 2 ? "day2" : "day1";
                STATE.field[i][key] = JSON.stringify(scores);
                break;
              }
            }
            setTimeout(function () { if (!STATE.savingCount) setLive(""); }, 1200);
          })
          .catch(function () { STATE.savingCount--; setLive("err"); });
      }

      // Attest button click. `role` is one of "marker" | "team" | "team-own".
      // "team-own" is the mirror-block chip that always attests the captain's
      // own team regardless of active card. Client sends attestAs=team with
      // no targetId — server forces write to captainOwnId. All three paths
      // reload from the server on success so the sig lines paint the fresh
      // signature + timestamp instead of a stale local view.
      function attestClick(role) {
        var target = _active(); if (!target) return;
        var isTeamOwn = role === "team-own";
        var attestAs = (role === "marker") ? "marker" : "team";
        var targetName = isTeamOwn
          ? (STATE.team && STATE.team.teamName) || "your team"
          : (target.teamName || "this team");
        var msg = attestAs === "marker"
          ? "Certify these scores for " + targetName + "?\n\nDouble-check hole-by-hole before signing — an attested card locks the round."
          : "Accept " + targetName + "'s scores as final?\n\nYou're signing off as team captain.";
        if (!confirm(msg)) return;
        setLive("saving");
        var body = { token: TOKEN, day: STATE.day, attestAs: attestAs };
        if (!isTeamOwn) body.targetId = target.id;
        fetch(FH_API.url("/api/tournament-score"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (j) {
            if (!j || !j.ok) {
              setLive("err");
              alert((j && j.error) || "Could not save the attestation.");
              return;
            }
            setLive("saved");
            // Re-fetch the full payload so both signature lines paint
            // from the server-of-truth (rather than a locally-guessed
            // timestamp that might drift from Airtable's copy).
            load();
          })
          .catch(function () { setLive("err"); alert("Network error saving the attestation."); });
      }

      function wire() {
        Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function (b) {
          b.addEventListener("click", function () { STATE.tab = b.getAttribute("data-tab"); render(); });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function (b) {
          b.addEventListener("click", function () {
            STATE.day = Number(b.getAttribute("data-day")) || 1;
            // Marker assignment can differ per day (different pairing
            // groups on Day 2), so re-select the active card + reload
            // its scores before landing on the first blank hole.
            _syncActiveCardForDay();
            STATE.holeIdx = firstBlankInPlayOrder(STATE.day);
            render();
          });
        });
        // Card switcher (group scorer mode) — pick which tee-mate
        // to score.
        Array.prototype.forEach.call(document.querySelectorAll("[data-card]"), function (b) {
          b.addEventListener("click", function () {
            var id = b.getAttribute("data-card");
            if (!id || id === STATE.activeCardId) return;
            STATE.activeCardId = id;
            var active = _findTeam(id);
            if (active) {
              STATE.scores[1] = parseScores(active.day1);
              STATE.scores[2] = parseScores(active.day2);
            }
            STATE.holeIdx = firstBlankInPlayOrder(STATE.day);
            render();
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-jumpidx]"), function (b) {
          b.addEventListener("click", function () { STATE.holeIdx = Number(b.getAttribute("data-jumpidx")); render(); });
        });
        // End-of-round attestation buttons. Marker sign covers active card;
        // team sign covers active card if it IS own team; team-own sign
        // (from the mirror block) always attests the captain's own team
        // regardless of which card is active. Client-side confirm keeps a
        // stray tap from locking a card.
        Array.prototype.forEach.call(document.querySelectorAll("[data-attest]"), function (b) {
          b.addEventListener("click", function () { attestClick(b.getAttribute("data-attest")); });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-lb]"), function (b) {
          b.addEventListener("click", function () { STATE.lbFilter = b.getAttribute("data-lb"); render(); });
        });
        var prev = document.getElementById("prevHole");
        if (prev) prev.addEventListener("click", function () { stepHole(-1); render(); });
        var next = document.getElementById("nextHole");
        if (next) next.addEventListener("click", function () { stepHole(1); render(); });
        var down = document.getElementById("scDown");
        if (down) down.addEventListener("click", function () { bumpScore(-1); });
        var up = document.getElementById("scUp");
        if (up) up.addEventListener("click", function () { bumpScore(1); });
        // "Use one" buttons on each extras row — data-use-extra names
        // the extra to burn. useExtra() handles rollback on server error.
        Array.prototype.forEach.call(document.querySelectorAll("[data-use-extra]"), function (b) {
          b.addEventListener("click", function () {
            b.classList.add("is-saving");
            useExtra(b.getAttribute("data-use-extra"));
          });
        });
      }

      // Refresh periodically so:
      //   - The Leaderboard tab shows other teams' scores as they come in
      //   - Spectator / marker views see the group scorer's live updates
      //     for the OWN team's read-only block
      // Idle when there's nothing to refresh (self-score captain on the
      // Scorecard tab has nothing to poll for) so we stay gentle on
      // battery + data.
      setInterval(function () {
        if (!STATE.team) return;
        var onLb = STATE.tab === "lb";
        var assign = _dayAssignment() || { mode: "self" };
        var needsLiveMirror = STATE.tab === "score" && assign.mode !== "self";
        if (!onLb && !needsLiveMirror) return;
        fetch(FH_API.url("/api/tournament-signups?live=" + encodeURIComponent(TOKEN)), { cache: "no-store" })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (j) {
            if (!j || !j.ok) return;
            STATE.team = j.team;
            STATE.field = j.field || [];
            STATE.marker = (j.markerAssignment && j.markerAssignment.d1)
              ? j.markerAssignment
              : STATE.marker;
            // Re-sync the ACTIVE card's scores from the fresh field
            // (the group scorer may have written new holes since we
            // last rendered). Skip when we have a pending local save
            // to avoid overwriting the operator mid-edit.
            if (!STATE.savingCount) {
              var active = _findTeam(STATE.activeCardId);
              if (active) {
                STATE.scores[1] = parseScores(active.day1);
                STATE.scores[2] = parseScores(active.day2);
              }
            }
            render();
          })
          .catch(function () {});
      }, 20000);

      load();
    })();
  </script>
</body>
</html>
