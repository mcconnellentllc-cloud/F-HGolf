<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Score my round — F&amp;H Golf</title>
  <meta name="theme-color" content="#17472A" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    /* Same scorecard theme as live.html — dark by default, matching what
       everyone liked from the tournament scorer. Just enough to render
       the hole card, +/- controls, front/back dots strip, and the
       Thru/Gross/To-par totals. No tournament complexity (no marker,
       no team, no mulligans). */
    :root {
      --paper:#f6f2e8;--paper-2:#ede7d6;--card:#fff;--line:#d8d1bd;
      --ink:#1b2618;--muted:#7a7663;--green:#17472A;--green-strong:#17472A;
      --green-soft:#dfe7dc;--brass:#a37f30;--brass-soft:#f4e6c1;
      --danger:#b11e2d;--live:#d43a2d;
      --shadow:0 1px 2px rgba(23,71,42,0.06),0 4px 12px rgba(23,71,42,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper:#10160e;--paper-2:#171e13;--card:#1e2618;--line:#2d3722;
        --ink:#e9e3cd;--muted:#8f8a76;--green:#7db997;--green-strong:#7db997;
        --green-soft:#223122;--brass:#d0ac66;--brass-soft:#3a2e18;
        --danger:#ea919a;--live:#ef7069;
        --shadow:0 1px 2px rgba(0,0,0,0.4),0 8px 20px rgba(0,0,0,0.35);
      }
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;}
    body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom);}
    #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

    .app-hd{display:flex;align-items:center;gap:0.7rem;padding:0.85rem 1rem 0.75rem;padding-top:calc(0.85rem + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
    .app-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:inset 0 0 0 1.5px var(--brass);}
    .app-title{flex:1;min-width:0;}
    .app-title .t{font:500 0.98rem/1.15 Georgia,"Iowan Old Style",serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .app-title .sub{font:400 0.75rem/1.3 system-ui,sans-serif;color:var(--muted);margin-top:0.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .app-back{display:inline-flex;align-items:center;gap:0.3rem;padding:0.35rem 0.7rem;border-radius:999px;background:rgba(23,71,42,0.10);color:var(--green);font:700 0.78rem/1 system-ui,sans-serif;text-decoration:none;border:1px solid rgba(23,71,42,0.30);flex-shrink:0;}

    .body{flex:1;padding:0.95rem 0.95rem 1.5rem;}

    /* Setup card — first thing the player sees. Pick tees, course, notes. */
    .setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0.95rem 1rem 1rem;box-shadow:var(--shadow);margin-bottom:0.85rem;}
    .setup h2{margin:0 0 0.5rem 0;font:600 1rem/1.15 Georgia,serif;color:var(--ink);}
    .setup p{margin:0 0 0.75rem 0;color:var(--muted);font-size:0.86rem;}
    .setup-row{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem 0.75rem;}
    .setup-row.full{grid-template-columns:1fr;}
    .setup label{display:block;}
    .setup label span{display:block;font:700 0.66rem/1 system-ui,sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:0.25rem;}
    .setup input,.setup select{width:100%;padding:0.55rem 0.7rem;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);color:var(--ink);font:inherit;}
    .setup-holes{display:flex;gap:0.4rem;}
    .setup-holes label{flex:1;padding:0.55rem 0.5rem;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--paper-2);cursor:pointer;font-weight:600;}
    .setup-holes label:has(input:checked){background:var(--green-soft);border-color:var(--green-strong);color:var(--green);}
    .setup-holes input{position:absolute;opacity:0;pointer-events:none;}
    .setup-go{margin-top:0.85rem;width:100%;padding:0.85rem;border:none;border-radius:10px;background:var(--green-strong);color:#fff;font:700 0.98rem/1 system-ui,sans-serif;cursor:pointer;letter-spacing:0.02em;}
    .setup-go:active{transform:translateY(1px);}

    /* Hole card — same shape as live.html */
    .hole-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0.9rem 1rem 1rem;box-shadow:var(--shadow);margin-bottom:0.85rem;}
    .hole-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0.4rem;}
    .hole-arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:1.4rem;cursor:pointer;}
    .hole-arrow:disabled{opacity:0.3;cursor:default;}
    .hole-big{text-align:center;line-height:1;}
    .hole-big .lbl{font:700 0.68rem/1 system-ui,sans-serif;letter-spacing:0.16em;color:var(--muted);text-transform:uppercase;}
    .hole-big .num{font:400 3rem/1 Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:0.2rem;}
    .hole-meta{text-align:center;margin-top:0.45rem;font-size:0.8rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
    .dots-wrap{margin-top:0.85rem;padding-top:0.75rem;border-top:1px dashed var(--line);}
    .dots{display:grid;grid-template-columns:repeat(9,1fr);gap:0.25rem;}
    .dots-lap{display:flex;align-items:baseline;margin:0.55rem 0 0.3rem;}
    .dots-lap--back{margin-top:0.7rem;}
    .dots-lap__lbl{font:700 0.62rem/1 system-ui,sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);}
    .dot{text-align:center;padding:0.3rem 0;border-radius:6px;cursor:pointer;border:none;background:transparent;font:600 0.62rem/1 system-ui,sans-serif;color:var(--muted);}
    .dot .n{display:block;font-size:0.6rem;color:var(--muted);margin-bottom:0.2rem;}
    .dot .v{display:block;font:500 0.95rem/1 Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums;}
    .dot.done{background:var(--green-soft);} .dot.done .v{color:var(--green);}
    .dot.now{background:var(--brass-soft);} .dot.now .v{color:var(--brass);}
    .dot.empty .v{color:var(--muted);opacity:0.4;}

    /* +/- score row */
    .score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem 1.15rem;box-shadow:var(--shadow);margin-bottom:0.7rem;}
    .score-hd{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;margin-bottom:0.7rem;}
    .score-nm{font:600 0.98rem/1.15 system-ui,sans-serif;color:var(--ink);}
    .score-nm small{display:block;font:400 0.72rem/1.3 system-ui,sans-serif;color:var(--muted);margin-top:0.15rem;}
    .score-row{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:0.7rem;}
    .sc-btn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:500 1.9rem/1 system-ui,sans-serif;display:grid;place-items:center;touch-action:manipulation;}
    .sc-btn:active{transform:scale(0.94);}
    .sc-num{text-align:center;font:400 3rem/1 Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums;}
    .sc-num.empty{color:var(--muted);opacity:0.3;}
    .sc-label{text-align:center;margin-top:0.3rem;font:700 0.7rem/1 system-ui,sans-serif;letter-spacing:0.14em;text-transform:uppercase;min-height:0.8rem;}
    .sc-label.par{color:var(--muted);}
    .sc-label.birdie,.sc-label.eagle{color:var(--green);}
    .sc-label.bogey{color:var(--brass);}
    .sc-label.dbl,.sc-label.trip{color:var(--danger);}

    /* Totals */
    .totals{display:flex;gap:0.6rem;padding:0.75rem 0.85rem;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green-strong);border-radius:10px;margin-top:0.5rem;}
    .tot{flex:1;text-align:center;}
    .tot .k{font:700 0.62rem/1 system-ui,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
    .tot .v{font:500 1.2rem/1 Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:0.28rem;display:block;}
    .tot.pos .v{color:var(--brass);}
    .tot.neg .v{color:var(--green);}

    /* Save round + status */
    .save{margin-top:1rem;}
    .save-btn{display:block;width:100%;padding:0.95rem;background:var(--green-strong);color:#fff;border:none;border-radius:12px;font:700 1.02rem/1 system-ui,sans-serif;letter-spacing:0.02em;cursor:pointer;box-shadow:var(--shadow);}
    .save-btn:disabled{opacity:0.5;cursor:not-allowed;}
    .save-btn:active{transform:translateY(1px);}
    .save-tip{margin:0.55rem 0 0;font-size:0.78rem;color:var(--muted);text-align:center;}
    .save-status{margin-top:0.5rem;text-align:center;font-size:0.9rem;}
    .save-status.ok{color:var(--green);font-weight:700;}
    .save-status.err{color:var(--danger);font-weight:700;}

    .fill{flex:1;display:grid;place-items:center;padding:2rem 1.5rem;text-align:center;}
    .fill h2{font:400 1.35rem/1.2 Georgia,serif;color:var(--ink);margin:0 0 0.5rem;}
    .fill p{color:var(--muted);margin:0;max-width:30ch;}
    .fill a{color:var(--brass);}
    :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px;}
  </style>
</head>
<body>
  <div id="app">
    <header class="app-hd">
      <img class="app-logo" src="images/logo.png" alt="" />
      <div class="app-title">
        <div class="t" id="hdTitle">Score my round</div>
        <div class="sub" id="hdSub">Loading…</div>
      </div>
      <a class="app-back" href="player.html">&larr; Card</a>
    </header>

    <main class="body" id="body">
      <div class="fill" id="loading"><div><h2>Loading your card…</h2><p>One moment.</p></div></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); };
      var LS_TOKEN = "fh_player_token";
      var LS_DRAFT = "fh_round_draft_v1";

      // F&H Golf Course is a 9-hole layout: par 4,3,4,4,5,4,4,3,5 (par 36).
      // 18-hole rounds play the 9 twice, so PARS9[i % 9] gives par per hole
      // for any index 0..17. Matches live.html so the two feel identical.
      var PARS9 = [4, 3, 4, 4, 5, 4, 4, 3, 5];
      function parAt(idx) { return PARS9[idx % 9] || 4; }

      function readToken() {
        try { var p = new URLSearchParams(location.search).get("token"); if (p) return p; } catch (e) {}
        try { return localStorage.getItem(LS_TOKEN) || ""; } catch (e) { return ""; }
      }
      function saveToken(t) { try { localStorage.setItem(LS_TOKEN, t); } catch (e) {} }
      function fmtToPar(n) { if (n === 0) return "E"; return (n > 0 ? "+" : "") + n; }

      // State — player details + the round draft (persisted in localStorage
      // so a fumbled tab doesn't lose 12 holes of scoring).
      var STATE = {
        token: readToken(),
        player: null,
        holes: 18,
        tees: "White",
        course: "F&H Golf Course",
        date: iso(new Date()),
        notes: "",
        scores: null,   // array of length 9 or 18 (nulls until entered)
        holeIdx: 0,
        started: false,
      };
      function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

      // Draft: keep the latest in-flight round so a refresh mid-round
      // doesn't lose scores. Cleared on successful save.
      function loadDraft() {
        try { var raw = localStorage.getItem(LS_DRAFT); if (!raw) return null; return JSON.parse(raw); } catch (e) { return null; }
      }
      function saveDraft() {
        try {
          if (!STATE.started) return;
          localStorage.setItem(LS_DRAFT, JSON.stringify({
            holes: STATE.holes, tees: STATE.tees, course: STATE.course,
            date: STATE.date, notes: STATE.notes, scores: STATE.scores,
            holeIdx: STATE.holeIdx, ts: Date.now(),
          }));
        } catch (e) {}
      }
      function clearDraft() { try { localStorage.removeItem(LS_DRAFT); } catch (e) {} }

      // ---- Boot: verify magic-link token, load player name ----
      if (!STATE.token) return showFatal("Sign in to your Player Card first.", "player.html");
      saveToken(STATE.token);
      fetch(FH_API.url("/api/player-card"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "magic-verify", token: STATE.token })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (!j || !j.ok || !j.player) return showFatal((j && j.error) || "Your sign-in link isn't valid anymore. Get a new one.", "player.html");
          STATE.player = j.player;
          $("hdSub").textContent = j.player.name || "Player";
          hydrateFromUrl();
          showSetup();
          // Offer to resume an in-flight draft if one is stashed.
          var d = loadDraft();
          if (d && d.scores && d.scores.some(function (s) { return s != null; }) && Date.now() - (d.ts || 0) < 12 * 3600 * 1000) {
            if (confirm("You have a round in progress from earlier. Continue where you left off?")) {
              STATE.holes = d.holes; STATE.tees = d.tees; STATE.course = d.course;
              STATE.date = d.date; STATE.notes = d.notes; STATE.scores = d.scores;
              STATE.holeIdx = d.holeIdx || 0; STATE.started = true;
              renderRound();
              return;
            } else {
              clearDraft();
            }
          }
        })
        .catch(function () { showFatal("Network error checking your sign-in. Try again in a moment.", "player.html"); });

      function hydrateFromUrl() {
        try {
          var q = new URLSearchParams(location.search);
          var h = Number(q.get("holes")); if (h === 9 || h === 18) STATE.holes = h;
          var t = q.get("tees"); if (t) STATE.tees = t;
          var c = q.get("course"); if (c) STATE.course = c;
          var d = q.get("date"); if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) STATE.date = d;
        } catch (e) {}
      }

      function showFatal(msg, backHref) {
        $("body").innerHTML = '<div class="fill"><div><h2>' + esc(msg) + '</h2><p><a href="' + esc(backHref || "player.html") + '">Back to your Player Card</a></p></div></div>';
      }

      // ---- Setup screen ----
      function showSetup() {
        $("body").innerHTML =
          '<section class="setup">' +
          '  <h2>Score my round</h2>' +
          '  <p>Set your date, tees, and 9 or 18. Then tap Start to score hole by hole — same feel as our tournament scorecard.</p>' +
          '  <div class="setup-row">' +
          '    <label><span>Date</span><input type="date" id="stDate" value="' + esc(STATE.date) + '" /></label>' +
          '    <div>' +
          '      <span style="display:block;font:700 0.66rem/1 system-ui,sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:0.25rem;">Holes</span>' +
          '      <div class="setup-holes">' +
          '        <label><input type="radio" name="stHoles" value="9" ' + (STATE.holes === 9 ? "checked" : "") + ' /> 9</label>' +
          '        <label><input type="radio" name="stHoles" value="18" ' + (STATE.holes === 18 ? "checked" : "") + ' /> 18</label>' +
          '      </div>' +
          '    </div>' +
          '    <label><span>Tees</span><select id="stTees">' +
          ['White','Blue','Red','Gold','Combo','Other'].map(function (t) { return '<option ' + (t === STATE.tees ? "selected" : "") + '>' + t + '</option>'; }).join("") +
          '    </select></label>' +
          '    <label><span>Course</span><input type="text" id="stCourse" maxlength="120" value="' + esc(STATE.course) + '" /></label>' +
          '  </div>' +
          '  <div class="setup-row full" style="margin-top:0.6rem;">' +
          '    <label><span>Notes (optional)</span><input type="text" id="stNotes" maxlength="1000" placeholder="Weather, playing partners, memorable holes…" value="' + esc(STATE.notes) + '" /></label>' +
          '  </div>' +
          '  <button type="button" class="setup-go" id="stStart">Start scoring &rarr;</button>' +
          '</section>';
        $("stStart").addEventListener("click", function () {
          STATE.date = $("stDate").value;
          var h = document.querySelector('input[name="stHoles"]:checked');
          STATE.holes = h ? Number(h.value) : 18;
          STATE.tees = $("stTees").value;
          STATE.course = ($("stCourse").value || "F&H Golf Course").trim();
          STATE.notes = ($("stNotes").value || "").trim();
          STATE.scores = new Array(STATE.holes).fill(null);
          STATE.holeIdx = 0;
          STATE.started = true;
          saveDraft();
          renderRound();
        });
      }

      // ---- Round screen ----
      function renderRound() {
        var body = $("body"); body.innerHTML = "";
        body.appendChild(holeCard());
        body.appendChild(scoreCard());
        body.appendChild(totalsBar());
        body.appendChild(saveBar());
        wireEvents();
        saveDraft();
      }
      function holeCard() {
        var el = document.createElement("section");
        el.className = "hole-card";
        var idx = STATE.holeIdx;
        var holeN = (idx % 9) + 1;
        var lap = idx >= 9 ? 2 : 1;
        var lapNote = (STATE.holes === 18 && lap === 2) ? " · 2nd time around" : "";
        el.innerHTML =
          '<div class="hole-nav">' +
          '  <button class="hole-arrow" id="holePrev" ' + (idx === 0 ? "disabled" : "") + '>&#x2039;</button>' +
          '  <div class="hole-big"><div class="lbl">Hole</div><div class="num">' + holeN + '</div></div>' +
          '  <button class="hole-arrow" id="holeNext" ' + (idx >= STATE.holes - 1 ? "disabled" : "") + '>&#x203A;</button>' +
          '</div>' +
          '<div class="hole-meta">Par ' + parAt(idx) + lapNote + '</div>' +
          dotsMarkup();
        return el;
      }
      function dotsMarkup() {
        var s = STATE.scores || [];
        var out = '<div class="dots-wrap">';
        // Front 9 always visible
        out += '<div class="dots-lap"><span class="dots-lap__lbl">Front 9</span></div>';
        out += '<div class="dots">';
        for (var i = 0; i < 9; i++) out += dotButton(i, s[i]);
        out += '</div>';
        if (STATE.holes === 18) {
          out += '<div class="dots-lap dots-lap--back"><span class="dots-lap__lbl">Back 9</span></div>';
          out += '<div class="dots">';
          for (var j = 9; j < 18; j++) out += dotButton(j, s[j]);
          out += '</div>';
        }
        out += '</div>';
        return out;
      }
      function dotButton(idx, score) {
        var cls = (idx === STATE.holeIdx) ? "now" : (score != null ? "done" : "empty");
        return '<button type="button" class="dot ' + cls + '" data-jumpidx="' + idx + '">'
          + '<span class="n">' + ((idx % 9) + 1) + '</span>'
          + '<span class="v">' + (score == null ? "–" : score) + '</span>'
          + '</button>';
      }
      function scoreCard() {
        var el = document.createElement("section");
        el.className = "score";
        var idx = STATE.holeIdx;
        var sc = (STATE.scores || [])[idx];
        var lbl = scoreLabel(sc, parAt(idx));
        el.innerHTML =
          '<div class="score-hd"><div class="score-nm">' + esc(STATE.player.name || "You") + '<small>Tap +/– for this hole</small></div></div>' +
          '<div class="score-row">' +
          '  <button class="sc-btn" id="scMinus" aria-label="Minus one">–</button>' +
          '  <div>' +
          '    <div class="sc-num' + (sc == null ? " empty" : "") + '">' + (sc == null ? "–" : sc) + '</div>' +
          '    <div class="sc-label ' + (lbl.cls || "") + '">' + esc(lbl.text || "") + '</div>' +
          '  </div>' +
          '  <button class="sc-btn" id="scPlus" aria-label="Plus one">+</button>' +
          '</div>';
        return el;
      }
      function scoreLabel(sc, par) {
        if (sc == null) return { text: "" };
        var diff = sc - par;
        if (diff <= -2) return { text: sc === 1 ? "Ace" : "Eagle", cls: "eagle" };
        if (diff === -1) return { text: "Birdie", cls: "birdie" };
        if (diff === 0) return { text: "Par", cls: "par" };
        if (diff === 1) return { text: "Bogey", cls: "bogey" };
        if (diff === 2) return { text: "Double", cls: "dbl" };
        if (diff === 3) return { text: "Triple", cls: "trip" };
        return { text: "+" + diff };
      }
      function totalsBar() {
        var el = document.createElement("div");
        el.className = "totals";
        var s = STATE.scores || [];
        var thru = 0, gross = 0, parSoFar = 0;
        for (var i = 0; i < s.length; i++) if (s[i] != null) { thru++; gross += s[i]; parSoFar += parAt(i); }
        var toPar = thru ? gross - parSoFar : null;
        el.innerHTML =
          '<div class="tot"><span class="k">Thru</span><span class="v">' + thru + '</span></div>' +
          '<div class="tot"><span class="k">Gross</span><span class="v">' + (thru ? gross : "–") + '</span></div>' +
          '<div class="tot ' + (toPar > 0 ? "pos" : toPar < 0 ? "neg" : "") + '"><span class="k">To par</span><span class="v">' + (thru ? fmtToPar(toPar) : "–") + '</span></div>';
        return el;
      }
      function saveBar() {
        var el = document.createElement("div");
        el.className = "save";
        var s = STATE.scores || [];
        var filled = s.filter(function (v) { return v != null; }).length;
        var allDone = filled === STATE.holes;
        var label = allDone ? "Save round" : "Save round (" + filled + " / " + STATE.holes + " holes)";
        el.innerHTML =
          '<button type="button" class="save-btn" id="saveBtn"' + (filled === 0 ? " disabled" : "") + '>' + label + '</button>' +
          '<p class="save-tip">' + (allDone ? "Ready to save — all " + STATE.holes + " holes filled." : "You can save at any point; partial rounds are OK too.") + '</p>' +
          '<p class="save-status" id="saveStatus" role="status" aria-live="polite"></p>';
        return el;
      }
      function wireEvents() {
        $("holePrev").addEventListener("click", function () { if (STATE.holeIdx > 0) { STATE.holeIdx--; renderRound(); } });
        $("holeNext").addEventListener("click", function () { if (STATE.holeIdx < STATE.holes - 1) { STATE.holeIdx++; renderRound(); } });
        $("scPlus").addEventListener("click", function () { bump(1); });
        $("scMinus").addEventListener("click", function () { bump(-1); });
        Array.prototype.forEach.call(document.querySelectorAll(".dot"), function (btn) {
          btn.addEventListener("click", function () {
            var i = Number(btn.getAttribute("data-jumpidx"));
            if (i >= 0 && i < STATE.holes) { STATE.holeIdx = i; renderRound(); }
          });
        });
        $("saveBtn").addEventListener("click", commitRound);
      }
      function bump(delta) {
        var idx = STATE.holeIdx;
        var cur = (STATE.scores || [])[idx];
        var next;
        if (cur == null) {
          // First tap: seed at par so + / – both feel useful right away.
          next = delta > 0 ? parAt(idx) + 1 : Math.max(1, parAt(idx) - 1);
        } else {
          next = cur + delta;
        }
        if (next < 1) next = 1;
        if (next > 20) next = 20;
        STATE.scores[idx] = next;
        saveDraft();
        renderRound();
      }

      function commitRound() {
        var btn = $("saveBtn"); var status = $("saveStatus");
        var s = STATE.scores || [];
        var gross = 0, filled = 0;
        for (var i = 0; i < s.length; i++) if (s[i] != null) { gross += s[i]; filled++; }
        if (!filled) { setStatus("Enter at least one hole first.", "err"); return; }
        // If they save early, still record `holes` as they configured
        // (9 or 18) so the running average grouping stays clean. Rounds
        // with fewer than the full count are noted so staff can decide
        // whether to include them.
        btn.disabled = true; btn.textContent = "Saving…"; setStatus("");
        var payload = {
          action: "rounds-save",
          token: STATE.token,
          date: STATE.date,
          holes: STATE.holes,
          tees: STATE.tees,
          course: STATE.course,
          gross: gross,
          scores: s,
          notes: (STATE.notes || "") + (filled < STATE.holes ? " · partial round (" + filled + " / " + STATE.holes + " holes)" : ""),
        };
        fetch(FH_API.url("/api/player-card"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (j) {
            if (j && j.ok) {
              clearDraft();
              setStatus("Saved! Redirecting to your card…", "ok");
              setTimeout(function () { location.href = "player.html"; }, 900);
            } else {
              btn.disabled = false; btn.textContent = "Save round";
              setStatus((j && j.error) || "Couldn't save your round.", "err");
            }
          })
          .catch(function () {
            btn.disabled = false; btn.textContent = "Save round";
            setStatus("Network error saving.", "err");
          });
      }
      function setStatus(msg, kind) {
        var el = $("saveStatus"); if (!el) return;
        el.textContent = msg || "";
        el.className = "save-status " + (kind || "");
      }
    })();
  </script>
</body>
</html>
