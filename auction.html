<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction — F&H Golf Course</title>
  <meta name="description" content="Live auction gallery for an F&H Golf Course tournament." />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <meta name="theme-color" content="#0b1a10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1a10; --bg-2: #12261a;
      --panel: rgba(255,255,255,0.06); --line: rgba(255,255,255,0.14);
      --gold: #f5c542; --ink: #f6f9f4; --muted: rgba(246,249,244,0.62);
      --red: #c8102e; --red-deep: #7a0a1a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", -apple-system, system-ui, sans-serif; min-height: 100vh; }
    body { background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 60%); }

    .disp { min-height: 100vh; display: flex; flex-direction: column; }
    .disp__hero { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(0.75rem, 2vw, 1.5rem); padding: clamp(1rem, 2vw, 1.5rem) clamp(1rem, 2vw, 1.75rem); background: #000; border-bottom: 3px solid #000; }
    .disp__logo { width: clamp(3.4rem, 6vw, 5.4rem); height: clamp(3.4rem, 6vw, 5.4rem); border-radius: 50%; background: #fff; padding: clamp(0.25rem, 0.5vw, 0.45rem); box-shadow: 0 0 0 3px #000, 0 0 0 5px rgba(255,255,255,0.15); object-fit: contain; }
    .disp__logo--r { justify-self: end; }
    .disp__hero__title { text-align: center; }
    .disp__eyebrow { text-transform: uppercase; letter-spacing: 0.4em; color: #fff; font-weight: 800; font-size: clamp(0.7rem, 1.15vw, 0.95rem); }
    .disp__title { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: clamp(2.1rem, 5vw, 4.2rem); margin: 0.1em 0 0; line-height: 1; letter-spacing: 0.01em; color: #fff; }
    .disp__sub { color: rgba(255,255,255,0.75); font-size: clamp(0.95rem, 1.5vw, 1.2rem); margin: 0.15em 0 0; font-style: italic; }
    @media (max-width: 720px) {
      .disp__hero { grid-template-columns: 1fr; text-align: center; padding-top: 1rem; }
      .disp__logo { margin: 0 auto; }
      .disp__logo--r { display: none; }
    }
    .disp__nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 0.75rem 1rem; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--line); }
    .disp__nav a { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.95rem; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--ink); font-weight: 700; text-decoration: none; font-size: clamp(0.85rem, 1.1vw, 1rem); letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease, color 0.15s ease; }
    .disp__nav a:hover, .disp__nav a:focus-visible { background: var(--gold); color: #0b1a10; border-color: var(--gold); outline: none; }
    .disp__nav a.is-here { background: rgba(245,197,66,0.15); color: var(--gold); border-color: rgba(245,197,66,0.35); pointer-events: none; }

    .share { display: flex; justify-content: center; gap: 0.5rem; padding: 1rem; flex-wrap: wrap; }
    .share__btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 999px; background: var(--gold); color: #0b1a10; border: none; font: 700 0.9rem/1 inherit; letter-spacing: 0.03em; cursor: pointer; text-decoration: none; }
    .share__btn:hover { background: #fff; }

    .au { flex: 1; max-width: 78rem; width: 100%; margin: 0 auto; padding: 1rem clamp(1rem, 2vw, 2rem) 3rem; }
    .au-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr)); gap: 1rem; }
    .au-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .au-card__photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #000; display: block; }
    .au-card__photo--empty { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.35); font: 800 1.2rem/1 "Fraunces", Georgia, serif; letter-spacing: 0.2em; text-transform: uppercase; }
    /* Two-photo layout: big lead image with a small inset thumbnail so
       bidders can see a second angle without a lightbox click. */
    .au-card__photo--multi { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; }
    .au-card__photo-main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .au-card__photo-thumb { position: absolute; right: 0.5rem; bottom: 0.5rem; width: 32%; max-width: 128px; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 2px 8px rgba(0,0,0,0.45); background: #000; }
    .au-card__body { padding: 0.85rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
    .au-card__name { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.2rem; margin: 0; color: #fff; line-height: 1.2; }
    .au-card__desc { color: rgba(255,255,255,0.82); font-size: 0.92rem; line-height: 1.35; margin: 0; }
    .au-card__meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
    .au-card__chip { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font: 700 0.72rem/1.4 "Source Sans 3", system-ui, sans-serif; letter-spacing: 0.03em; background: rgba(255,255,255,0.08); color: #fff; }
    .au-card__chip--floor { background: var(--gold); color: #0b1a10; }
    .au-card__chip--sold { background: var(--red); color: #fff; }
    .au-card__chip--donor { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); font-weight: 600; }
    .au-card__winner { margin-top: 0.35rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); font-size: 0.85rem; color: rgba(255,255,255,0.72); }
    .au-card__winner b { color: var(--gold); }
    .au-empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-style: italic; }
    .missing { max-width: 40rem; margin: 4rem auto; padding: 2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: center; }
    .missing h1 { font-family: "Fraunces", Georgia, serif; color: var(--gold); margin: 0 0 0.5rem; }
    .missing a { color: var(--gold); font-weight: 700; }
    .disp__foot { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0.6rem 1rem 1.5rem; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main class="disp" role="main">
    <header class="disp__hero">
      <img class="disp__logo" src="images/logo.png" alt="F&H Golf Course" />
      <div class="disp__hero__title">
        <div class="disp__eyebrow">Live Auction</div>
        <h1 class="disp__title" id="auTitle">Auction</h1>
        <p class="disp__sub" id="auSub">F&amp;H Golf Course</p>
      </div>
      <img class="disp__logo disp__logo--r" src="images/logo.png" alt="" aria-hidden="true" />
    </header>

    <nav class="disp__nav" aria-label="Tournament public pages">
      <a href="index.html">F&amp;H Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a id="navLeaderboard" href="leaderboard.html">Live leaderboard</a>
      <a class="is-here" aria-current="page">Auction</a>
      <a id="navRecap" href="recap.html">Recap</a>
    </nav>

    <div class="share">
      <a class="share__btn" id="shareFb" href="#" target="_blank" rel="noopener">Share on Facebook</a>
      <a class="share__btn" id="shareSms" href="#">Text this auction</a>
      <button class="share__btn" type="button" id="shareCopy">Copy link</button>
    </div>

    <section class="au" aria-label="Auction items">
      <div class="au-grid" id="auGrid">
        <p class="au-empty">Loading auction items&hellip;</p>
      </div>
    </section>

    <footer class="disp__foot"><span id="auFoot">A small town with a big heart &mdash; every dollar backs the neighbors who answer the call.</span></footer>
  </main>

  <script src="js/theme-fire.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var KEY = params.get("t") || "";
      var titleEl = document.getElementById("auTitle");
      var subEl = document.getElementById("auSub");
      var grid = document.getElementById("auGrid");
      var navLb = document.getElementById("navLeaderboard");
      var navRc = document.getElementById("navRecap");
      var shareFb = document.getElementById("shareFb");
      var shareSms = document.getElementById("shareSms");
      var shareCopy = document.getElementById("shareCopy");
      var foot = document.getElementById("auFoot");

      if (!KEY) {
        document.querySelector(".disp").innerHTML =
          '<div class="missing"><h1>Pick a tournament</h1>'
          + '<p>This page needs a tournament to know which auction to show. Head to <a href="tournaments.html">Tournaments</a> and open one.</p></div>';
        return;
      }
      navLb.href = "leaderboard.html?t=" + encodeURIComponent(KEY);
      navRc.href = "recap.html?t=" + encodeURIComponent(KEY);
      document.title = KEY + " — Auction | F&H Golf Course";

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function money(n) { n = Number(n) || 0; return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }

      function applyTitle(display) {
        var name = display || KEY;
        var m = /^(.*)\s+\(([^)]+)\)\s*$/.exec(name);
        if (m) { titleEl.textContent = m[1]; subEl.innerHTML = "F&amp;H Golf Course &middot; " + esc(m[2]); }
        else { titleEl.textContent = name; subEl.textContent = "F&H Golf Course"; }
      }

      // Share buttons — Facebook + SMS + Copy. Uses fandhgolf.com as
      // the canonical share host so a link pasted anywhere goes to the
      // production site rather than a Vercel preview URL.
      var publicUrl = "https://fandhgolf.com/auction.html?t=" + encodeURIComponent(KEY);
      shareFb.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(publicUrl);
      shareSms.href = "sms:?&body=" + encodeURIComponent("Bid on tournament auction items: " + publicUrl);
      shareCopy.addEventListener("click", function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(publicUrl).then(function () { shareCopy.textContent = "Link copied ✓"; setTimeout(function () { shareCopy.textContent = "Copy link"; }, 1600); });
          } else {
            var ta = document.createElement("textarea"); ta.value = publicUrl; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
            shareCopy.textContent = "Link copied ✓"; setTimeout(function () { shareCopy.textContent = "Copy link"; }, 1600);
          }
        } catch (e) {}
      });

      function render(items) {
        if (!items.length) {
          grid.innerHTML = '<p class="au-empty">No auction items yet. Check back before the tournament for a full list.</p>';
          return;
        }
        grid.innerHTML = items.map(function (it) {
          // Support both the new `photos` array and legacy `photoDataUri`
          // string. New items save as `photos: [dataUri, dataUri]`; old
          // items still carry `photoDataUri` until they're re-saved.
          var photoList = [];
          if (Array.isArray(it.photos)) {
            photoList = it.photos.filter(function (p) {
              return typeof p === "string" && p.indexOf("data:image/") === 0;
            });
          } else if (typeof it.photoDataUri === "string" && it.photoDataUri.indexOf("data:image/") === 0) {
            photoList = [it.photoDataUri];
          }
          var photo;
          if (!photoList.length) {
            photo = '<div class="au-card__photo au-card__photo--empty">No photo</div>';
          } else if (photoList.length === 1) {
            photo = '<img class="au-card__photo" alt="" src="' + esc(photoList[0]) + '">';
          } else {
            // Two photos — big lead image, a smaller thumbnail beside it
            // so bidders can see both angles without opening a lightbox.
            photo = '<div class="au-card__photo au-card__photo--multi">'
              + '<img class="au-card__photo-main" alt="" src="' + esc(photoList[0]) + '">'
              + '<img class="au-card__photo-thumb" alt="" src="' + esc(photoList[1]) + '">'
              + '</div>';
          }
          // Public view — never expose winning amounts or buyer identity.
          // Just the item, floor (opening bid), donor, and a soft "SOLD"
          // chip so viewers can see what's still open. Numbers + names
          // stay inside the workbook Clerk tab.
          var chips = [];
          if (it.floor) chips.push('<span class="au-card__chip au-card__chip--floor">Floor ' + money(it.floor) + '</span>');
          if (it.donor) chips.push('<span class="au-card__chip au-card__chip--donor">Donated by ' + esc(it.donor) + '</span>');
          if (it.sold && it.sold.amount) chips.push('<span class="au-card__chip au-card__chip--sold">SOLD</span>');
          return ''
            + '<article class="au-card">'
            +   photo
            +   '<div class="au-card__body">'
            +     '<h2 class="au-card__name">' + esc(it.name || "(item)") + '</h2>'
            +     (it.description ? '<p class="au-card__desc">' + esc(it.description) + '</p>' : "")
            +     (chips.length ? '<div class="au-card__meta">' + chips.join("") + '</div>' : "")
            +   '</div>'
            + '</article>';
        }).join("");
      }

      // Fetch config for the auction items + tournament display name.
      fetch(FH_API.url("/api/tournament-signups") + "?config=" + encodeURIComponent(KEY), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var fields = (j && j.ok && j.record && j.record.fields) || null;
          var display = (fields && (fields["Display Name"] || fields["Name"])) || "";
          applyTitle(display);
          var raw = fields && fields["Auction Items JSON"];
          var items = [];
          try { var parsed = JSON.parse(raw || "{}"); if (parsed && Array.isArray(parsed.items)) items = parsed.items; } catch (e) {}
          items = items.filter(function (i) { return i && i.name; });
          render(items);
          if (!items.length && foot) foot.textContent = "This auction is being set up. Items will appear here soon.";
        })
        .catch(function () {
          applyTitle("");
          grid.innerHTML = '<p class="au-empty">Couldn\'t load the auction right now. Please try again in a moment.</p>';
        });
    })();
  </script>
</body>
</html>
